[[rule]]
id = "eclipse.p2-pool"
name = "Eclipse shared bundle pool"
bucket = "system"
group = "IDEs"
kind = "path"
paths = ["~/.p2/pool"]
cost = "redownload"
tier = "review"
running_apps = ["eclipse", "Eclipse"]
tags = ["ide", "eclipse", "plugins"]
stacks = ["java"]
description = "Plugins shared by Eclipse installs made with the Eclipse Installer; installs that use the pool stop working without it."

# ---------------------------------------------------------------------------
# Sublime Text and Nova
# ---------------------------------------------------------------------------

[[rule]]
id = "sublime.caches"
name = "Sublime Text caches"
bucket = "system"
group = "Editors"
kind = "path"
paths = ["~/Library/Caches/com.sublimetext.4", "~/Library/Caches/com.sublimetext.3", "~/Library/Application Support/Sublime Text/Index", "~/Library/Application Support/Sublime Text 3/Index"]
cost = "rebuild"
running_apps = ["sublime_text"]
warm_days = 14
rebuild = "Sublime Text re-indexes open folders"
tags = ["editor", "sublime-text", "cache", "index"]
stacks = ["sublime"]
description = "Sublime Text's symbol index and caches; packages and settings stay."

[[rule]]
id = "nova.caches"
name = "Nova caches"
bucket = "system"
group = "Editors"
kind = "path"
paths = ["~/Library/Caches/com.panic.Nova"]
cost = "rebuild"
running_apps = ["Nova"]
warm_days = 14
tags = ["editor", "nova", "cache"]
stacks = ["nova"]
description = "Caches of Panic's Nova editor."

# ---------------------------------------------------------------------------
# Neovim, Emacs and Helix
# ---------------------------------------------------------------------------

[[rule]]
id = "nvim.cache"
name = "Neovim cache"
bucket = "caches"
group = "Editors"
kind = "path"
paths = ["~/.cache/nvim"]
cost = "rebuild"
running_apps = ["nvim"]
warm_days = 14
tags = ["editor", "neovim", "cache"]
stacks = ["neovim"]
description = "Neovim's byte-compiled Lua cache and plugin caches; rebuilt on the next start."

[[rule]]
id = "nvim.plugins"
name = "Neovim plugins and tools"
bucket = "caches"
group = "Editors"
kind = "path"
paths = ["~/.local/share/nvim/lazy", "~/.local/share/nvim/mason", "~/.local/share/nvim/site/pack", "~/.local/state/nvim/lazy"]
cost = "redownload"
tier = "review"
running_apps = ["nvim"]
rebuild = ":Lazy restore (lazy-lock.json pins versions) and :MasonInstall"
tags = ["editor", "neovim", "lazyvim", "plugins", "language-server"]
stacks = ["neovim"]
description = "Plugins installed by lazy.nvim or packages, and language servers installed by mason.nvim."
recommend = "Safe when your config pins versions in lazy-lock.json; Neovim reinstalls everything on the next start."

[[rule]]
id = "nvim.logs"
name = "Neovim logs"
bucket = "junk"
group = "Logs"
kind = "path"
paths = ["~/.local/state/nvim/log", "~/.local/state/nvim/lsp.log", "~/.local/state/nvim/mason.log", "~/.local/state/nvim/conform.log"]
cost = "none"
tags = ["editor", "neovim", "logs"]
stacks = ["neovim"]
description = "Neovim, LSP client, mason and conform logs, which grow without bound."

[[rule]]
id = "emacs.native-comp"
name = "Emacs native-compilation caches"
bucket = "caches"
group = "Editors"
kind = "path"
paths = ["~/.emacs.d/eln-cache", "~/.config/emacs/eln-cache", "~/.emacs.d/.local/cache/eln", "~/.config/emacs/.local/cache/eln"]
cost = "rebuild"
running_apps = ["Emacs", "emacs"]
warm_days = 30
rebuild = "Emacs recompiles packages natively as it loads them"
tags = ["editor", "emacs", "cache"]
stacks = ["emacs"]
description = "Natively compiled .eln files, one set per Emacs build, so upgrades leave old ones behind."

[[rule]]
id = "emacs.packages"
name = "Emacs packages"
bucket = "caches"
group = "Editors"
kind = "path"
paths = ["~/.emacs.d/elpa", "~/.config/emacs/elpa", "~/.emacs.d/straight", "~/.config/emacs/straight", "~/.emacs.d/elpaca", "~/.config/emacs/elpaca", "~/.config/emacs/.local/straight", "~/.emacs.d/.local/straight"]
cost = "redownload"
tier = "review"
running_apps = ["Emacs", "emacs"]
rebuild = "package-install, straight or elpaca rebuild them; Doom: doom sync"
tags = ["editor", "emacs", "doom-emacs", "plugins"]
stacks = ["emacs"]
description = "Packages installed by package.el, straight.el, elpaca or Doom Emacs."

[[rule]]
id = "helix.grammar-sources"
name = "Helix grammar sources"
bucket = "caches"
group = "Editors"
kind = "path"
paths = ["~/.config/helix/runtime/grammars/sources"]
cost = "redownload"
warm_days = 30
rebuild = "hx --grammar fetch"
tags = ["editor", "helix", "cache"]
stacks = ["helix"]
description = "Tree-sitter grammar checkouts Helix fetched to build its grammars; the compiled grammars stay."

[[rule]]
id = "helix.logs"
name = "Helix log"
bucket = "junk"
group = "Logs"
kind = "path"
paths = ["~/.cache/helix/helix.log"]
cost = "none"
tags = ["editor", "helix", "logs"]
stacks = ["helix"]
description = "The log file Helix appends to on every run."
