# Editors and IDEs outside the VS Code family (that family and Zed are in ai.toml).
# JetBrains and Android Studio caches and logs per version are in langs.toml; this file
# adds the settings folders older IDE versions leave behind, Toolbox builds, and the
# plugin and package caches of terminal editors.

# ---------------------------------------------------------------------------
# JetBrains: one rule per product so the newest settings folder of each is kept.
# ---------------------------------------------------------------------------

[[rule]]
id = "jetbrains.old-config-intellij"
name = "Old IntelliJ IDEA settings"
bucket = "system"
group = "IDEs"
kind = "provider"
provider = "versions"
params.path = "~/Library/Application Support/JetBrains"
params.pattern = "IntelliJIdea20*"
params.keep = 1
cost = "data"
tier = "review"
action = "delete"
tags = ["ide", "jetbrains", "intellij", "old-versions"]
stacks = ["jetbrains"]
description = "IntelliJ IDEA settings, plugins and scratches from versions you upgraded from; the newest folder is the one in use."

