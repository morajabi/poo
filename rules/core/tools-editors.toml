[[rule]]
id = "jetbrains.toolbox-builds"
name = "JetBrains Toolbox IDE builds"
bucket = "system"
group = "IDEs"
kind = "path"
paths = ["~/Library/Application Support/JetBrains/Toolbox/apps/*/ch-*/[0-9]*"]
exclude = ["*.plugins", "*.vmoptions", "*.json"]
cost = "redownload"
tier = "review"
rebuild = "Toolbox installs a build again from its version list"
tags = ["ide", "jetbrains", "toolbox", "old-versions"]
stacks = ["jetbrains"]
description = "IDE builds Toolbox App 1.x installed per channel, including previous builds it keeps for rollback; the newest per channel is the one it launches."
recommend = "Turn off Toolbox > Settings > Keep previous versions, or roll back and uninstall from Toolbox itself."

[[rule]]
id = "jetbrains.toolbox-downloads"
name = "JetBrains Toolbox downloads"
bucket = "junk"
group = "Installers"
kind = "path"
paths = ["~/Library/Application Support/JetBrains/Toolbox/download"]
cost = "none"
contents = true
min_age_days = 1
tags = ["ide", "jetbrains", "toolbox", "staging"]
stacks = ["jetbrains"]
description = "Installer archives Toolbox downloaded before unpacking an IDE."

