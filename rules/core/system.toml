# Generic macOS sweeps: app caches, logs, temp files, installers, Homebrew and the Trash.
# Files load in name order and the first exact claim on a path wins, so the per-app
# and per-browser rules in macos-*.toml (and the stack files) beat the sweeps here.
# Any path a specific rule claims is also subtracted from the sweep item it sits in.

# ---------------------------------------------------------------------------
# Homebrew
# ---------------------------------------------------------------------------

[[rule]]
id = "system.homebrew-cache"
name = "Homebrew downloads"
bucket = "caches"
group = "Homebrew"
kind = "path"
paths = ["~/Library/Caches/Homebrew/downloads", "~/Library/Caches/Homebrew/Cask"]
cost = "redownload"
warm_days = 14
tags = ["homebrew", "downloads"]
stacks = ["homebrew", "macos"]
description = "Bottles and cask installers Homebrew downloaded; its api and bootsnap caches stay so brew remains fast."
recommend = "`brew cleanup --prune=all` does the same and also drops old versions."

[[rule]]
id = "system.homebrew-old"
name = "Old Homebrew versions"
bucket = "caches"
group = "Homebrew"
kind = "provider"
provider = "homebrew"
cost = "none"
tags = ["homebrew", "old-versions"]
stacks = ["homebrew", "macos"]
description = "Superseded formula and cask versions that `brew cleanup` removes."

[[rule]]
id = "system.homebrew-cask-installers"
name = "Kept cask installer packages"
bucket = "caches"
group = "Homebrew"
kind = "path"
paths = ["/opt/homebrew/Caskroom/*/*/*.{pkg,mpkg}", "/usr/local/Caskroom/*/*/*.{pkg,mpkg}"]
system = true
cost = "redownload"
tier = "review"
tags = ["homebrew", "installers"]
stacks = ["homebrew", "macos"]
description = "Installer packages Homebrew keeps inside the Caskroom after a pkg-based cask is installed; the installed software does not need them."
recommend = "Only the .pkg files are listed, never Caskroom binaries or apps. Uninstalls use the package receipts, not these files."

# ---------------------------------------------------------------------------
# App caches
# ---------------------------------------------------------------------------

[[rule]]
id = "system.app-caches"
name = "App caches"
bucket = "system"
group = "App caches"
kind = "path"
paths = ["~/Library/Caches"]
each = true
exclude = [
  # Apple and system daemons (some without a com.apple prefix)
  "com.apple.*", "CloudKit", "FamilyCircle", "familycircled", "GeoServices", "PassKit", "GameKit", "Animoji",
  "AMSDataMigratorTool", "askpermissiond", "mbuseragent", "BotPresenceAvatarAtlas", "*ShortcutsSandboxCache",
  # password managers and keychains
  "*1password*", "*1Password*", "*agilebits*", "*bitwarden*", "*Bitwarden*", "*lastpass*", "*LastPass*",
  "*dashlane*", "*Dashlane*", "*keepass*", "*KeePass*", "*enpass*", "*Enpass*", "*strongbox*", "*Strongbox*",
  "*outercorner*", "*proton*", "*Proton*", "*keychain*", "*Keychain*",
  # VPNs and proxies
  "*tailscale*", "*Tailscale*", "*wireguard*", "*WireGuard*", "*nordvpn*", "*NordVPN*", "*expressvpn*", "*ExpressVPN*",
  "*mullvad*", "*Mullvad*", "*surfshark*", "*windscribe*", "*privateinternetaccess*", "*openvpn*", "*OpenVPN*",
  "*anyconnect*", "*globalprotect*", "*GlobalProtect*", "*zscaler*", "*Zscaler*", "*surge*", "*clash*", "*Clash*",
  "*mihomo*", "*v2ray*", "*shadowrocket*", "*Shadowrocket*",
  # sync clients (see app.cloud-sync-caches)
  "*dropbox*", "*Dropbox*", "*OneDrive*", "*GoogleDrive*", "com.google.GoogleDrive", "*box.desktop*", "*backblaze*",
  "*synology*", "*nextcloud*", "*Nextcloud*", "*owncloud*", "*pcloud*", "*pCloud*",
  # device management and security agents
  "*jamf*", "*Jamf*", "*kandji*", "*Kandji*", "*mosyle*", "*munki*", "*crowdstrike*", "*CrowdStrike*",
  "*sentinelone*", "*SentinelOne*", "*kolide*",
  # owned by other rules or tools that keep state here
  "Homebrew", "com.docker.*", "*orbstack*", "pypoetry", "pnpm", "llama.cpp", "kitty", "org.R-project.R",
  "tealdeer", "Buzz", "GIPPseudonymousID", "CCTClearcutLogger",
]
cost = "rebuild"
warm_days = 30
tags = ["cache", "apps"]
stacks = ["macos"]
description = "One item per folder in ~/Library/Caches that no specific rule claims; apps rebuild these, so the next launch can be slower."
recommend = "Caches untouched for a month are the easy win. Apple, password manager, VPN, sync and device-management caches are excluded."

[[rule]]
id = "system.sandbox-caches"
name = "Sandboxed app caches"
bucket = "system"
group = "App caches"
kind = "path"
paths = ["~/Library/Containers/*/Data/Library/Caches"]
enabled = false
cost = "rebuild"
contents = true
warm_days = 30
min_bytes = 50000000
tags = ["cache", "apps", "sandboxed", "needs-permission"]
stacks = ["macos"]
description = "Caches inside App Store app containers, emptied but kept; off by default because macOS asks for permission to read other apps' containers."
recommend = "When you turn this on, check that no password manager or VPN container shows up before cleaning."

[[rule]]
id = "system.chromium-app-caches"
name = "Electron and Chromium app caches"
bucket = "system"
group = "App caches"
kind = "path"
paths = [
  "~/Library/Application Support/*/{Cache,Code Cache,GPUCache,DawnCache,DawnGraphiteCache,DawnWebGPUCache,GrShaderCache,GraphiteDawnCache,ShaderCache,GPUPersistentCache}",
  "~/Library/Application Support/*/Service Worker/{CacheStorage,ScriptCache}",
  "~/Library/Application Support/*/Partitions/*/{Cache,Code Cache,GPUCache}",
  "~/Library/Application Support/*/Partitions/*/Service Worker/CacheStorage",
]
cost = "rebuild"
contents = true
warm_days = 14
tags = ["cache", "electron", "chromium", "gpu-cache"]
stacks = ["macos", "electron"]
description = "HTTP, code, GPU and service worker caches of Electron and Chromium-based apps that no per-app rule covers."
recommend = "Per-app rules (app.*) add running-app checks for the common ones; password manager and VPN apps are claimed by app.protected-caches and never cleaned."

[[rule]]
id = "system.saved-state"
name = "Saved window state"
bucket = "system"
group = "macOS"
kind = "path"
paths = ["~/Library/Saved Application State"]
each = true
exclude = ["com.apple.*"]
cost = "none"
min_age_days = 30
tags = ["macos", "window-state"]
stacks = ["macos"]
description = "Window restoration state of apps you have not opened in a month."

[[rule]]
id = "system.quicklook"
name = "macOS caches"
bucket = "system"
group = "macOS"
kind = "path"
paths = [
  "~/Library/Caches/Quick Look",
  "~/Library/Caches/com.apple.QuickLook.thumbnailcache",
  "~/Library/Caches/com.apple.iconservices*",
  "~/Library/Caches/GeoServices",
  "~/Library/Caches/com.apple.helpd",
  "~/Library/Caches/com.apple.parsecd",
  "~/Library/Caches/com.apple.duetexpertd",
  "~/Library/Caches/com.apple.AppleMediaServices",
  "~/Library/Caches/com.apple.python",
  "~/Library/Caches/com.apple.rosetta.update",
  "~/Library/Caches/com.apple.amp.mediasevicesd",
]
cost = "rebuild"
contents = true
warm_days = 7
tags = ["macos", "quick-look", "thumbnails", "cache"]
stacks = ["macos"]
description = "Quick Look thumbnails, your icon cache, Maps tiles, Help, Spotlight suggestions and other macOS caches that refill on demand."

[[rule]]
id = "system.messages-previews"
name = "Messages preview caches"
bucket = "system"
group = "macOS"
kind = "path"
paths = ["~/Library/Messages/Caches/Previews", "~/Library/Messages/StickerCache"]
cost = "rebuild"
contents = true
running_apps = ["Messages"]
warm_days = 14
tags = ["macos", "messages", "thumbnails", "needs-permission"]
stacks = ["macos"]
description = "Thumbnail and sticker caches of Messages; real attachments are never touched."

[[rule]]
id = "system.mail-downloads"
name = "Mail attachment copies"
bucket = "junk"
group = "Mail"
kind = "path"
paths = ["~/Library/Mail Downloads"]
each = true
cost = "none"
running_apps = ["Mail"]
min_age_days = 30
tags = ["macos", "mail", "attachments", "needs-permission"]
stacks = ["macos"]
description = "Copies of attachments you opened from Mail; the originals stay in your mailbox."

# ---------------------------------------------------------------------------
# Logs and crash reports
# ---------------------------------------------------------------------------

[[rule]]
id = "junk.user-logs"
name = "App logs"
bucket = "junk"
group = "Logs"
kind = "path"
paths = ["~/Library/Logs"]
each = true
files = true
exclude = ["DiagnosticReports", "CoreSimulator", "JetBrains", "Zed", "Claude", "mole", "poo", "com.apple.*"]
cost = "none"
tags = ["logs"]
stacks = ["macos"]
description = "Logs apps write to ~/Library/Logs."

[[rule]]
id = "junk.app-support-logs"
name = "App logs in Application Support"
bucket = "junk"
group = "Logs"
kind = "path"
paths = [
  "~/Library/Application Support/Slack/logs",
  "~/Library/Application Support/Signal/logs",
  "~/Library/Application Support/discord/logs",
  "~/Library/Application Support/BeeperTexts/{logs,Logs}",
  "~/Library/Application Support/GitHub Desktop/{logs,Logs}",
  "~/Library/Application Support/Microsoft/Teams/logs",
  "~/Library/Application Support/Microsoft/Skype for Desktop/logs",
  "~/Library/Application Support/Steam/logs",
  "~/Library/Application Support/Epic/EpicGamesLauncher/Saved/Logs",
  "~/Library/Application Support/minecraft/logs",
  "~/Library/Application Support/rpcs3/logs",
  "~/Library/Application Support/iDingTalk/log",
  "~/Library/Application Support/iDingTalk/holmeslogs",
  "~/.lunarclient/logs",
  "~/.lunarclient/offline/*/logs",
]
cost = "none"
contents = true
tags = ["logs", "chat", "games", "electron"]
stacks = ["macos"]
description = "Log folders that chat apps, launchers and games keep next to their data instead of in ~/Library/Logs."

[[rule]]
id = "junk.crash-reports"
name = "Crash reports"
bucket = "junk"
group = "Logs"
kind = "path"
paths = [
  "~/Library/Logs/DiagnosticReports",
  "~/Library/Application Support/CrashReporter",
  "~/Library/Caches/SentryCrash",
  "~/Library/Caches/KSCrash",
  "~/Library/Caches/com.crashlytics.data",
  "~/Library/Application Support/*/Crashpad/completed",
  "~/Library/Application Support/minecraft/crash-reports",
]
cost = "none"
contents = true
tags = ["logs", "crash-reports"]
stacks = ["macos"]
description = "Crash and hang reports, including Chromium and Electron Crashpad reports that were already handled."

[[rule]]
id = "browser.crashpad"
name = "Browser crash reports"
bucket = "junk"
group = "Logs"
kind = "path"
paths = ["~/Library/Application Support/{Google,BraveSoftware,Microsoft,Yandex,Arc,Dia}/*/Crashpad/completed"]
cost = "none"
contents = true
tags = ["browsers", "logs", "crash-reports", "needs-permission"]
stacks = ["browsers", "macos"]
description = "Crash reports browsers already uploaded; inside browser profiles, so it needs Full Disk Access."

[[rule]]
id = "junk.homebrew-logs"
name = "Homebrew service logs"
bucket = "junk"
group = "Logs"
kind = "path"
paths = ["/opt/homebrew/var/log", "/usr/local/var/log"]
each = true
files = true
system = true
cost = "none"
min_age_days = 7
tags = ["homebrew", "logs"]
stacks = ["homebrew", "macos"]
description = "Logs of brew services (postgres, redis...) older than a week."

# ---------------------------------------------------------------------------
# Temp files
# ---------------------------------------------------------------------------

[[rule]]
id = "junk.temp"
name = "Temp files"
bucket = "junk"
group = "Temp"
kind = "path"
paths = ["$TMPDIR"]
each = true
files = true
exclude = ["com.apple.*", "*.sock", "*.socket", "TemporaryItems", "claude-*", "codex-*", "poo-*"]
cost = "none"
min_age_days = 3
tags = ["temp"]
stacks = ["macos"]
description = "Entries in your temp folder untouched for 3 days."

[[rule]]
id = "junk.playwright-profiles"
name = "Leaked browser automation profiles"
bucket = "junk"
group = "Temp"
kind = "path"
paths = ["$TMPDIR/playwright_chromiumdev_profile-*", "$TMPDIR/puppeteer_dev_chrome_profile-*", "$TMPDIR/lighthouse.*"]
cost = "none"
min_age_days = 1
tags = ["temp", "browsers", "automation"]
stacks = ["macos", "node"]
description = "Profiles left behind by Playwright, Puppeteer and Lighthouse runs."

# ---------------------------------------------------------------------------
# Downloads and installers
# ---------------------------------------------------------------------------

[[rule]]
id = "junk.incomplete-downloads"
name = "Incomplete downloads"
bucket = "junk"
group = "Installers"
kind = "path"
paths = ["~/Downloads/*.{crdownload,download,part,opdownload}"]
cost = "none"
min_age_days = 2
tags = ["downloads"]
stacks = ["macos", "browsers"]
description = "Browser downloads that never finished."

[[rule]]
id = "junk.installers"
name = "Installers in Downloads"
bucket = "junk"
group = "Installers"
kind = "path"
paths = [
  "~/Downloads/*.{dmg,DMG,pkg,PKG,mpkg,iso,ISO,xip,ipsw}",
  "~/Desktop/*.{dmg,DMG,pkg,PKG,mpkg,iso,ISO,xip,ipsw}",
]
cost = "redownload"
warm_days = 14
tags = ["installers", "downloads"]
stacks = ["macos"]
description = "Disk images, installer packages and firmware files at the top of Downloads and Desktop; once installed, they are dead weight."

[[rule]]
id = "junk.macos-installers"
name = "Old macOS installers"
bucket = "junk"
group = "Installers"
kind = "path"
paths = ["/Applications/Install macOS*.app"]
system = true
cost = "redownload"
tier = "review"
action = "trash"
tags = ["installers", "macos"]
stacks = ["macos"]
description = "Full macOS installer apps of 12 GB or more."

[[rule]]
id = "junk.trash"
name = "Trash"
bucket = "junk"
group = "Trash"
kind = "path"
paths = ["~/.Trash"]
each = true
files = true
cost = "none"
tier = "review"
tags = ["trash"]
stacks = ["macos"]
description = "Things you already threw away; cleaning here is permanent."

# ---------------------------------------------------------------------------
# ~/.cache
# ---------------------------------------------------------------------------

[[rule]]
id = "system.xdg-cache"
name = "~/.cache folders"
bucket = "caches"
group = "~/.cache"
kind = "path"
paths = ["~/.cache"]
each = true
exclude = ["huggingface", "torch", "puppeteer", "pre-commit", "uv", "pip", "zig", "bazel", "bazelisk", "sccache", "ccache", "deno", "yarn", "node", "node-gyp", "electron", "codex-runtimes", "opencode", "chrome-devtools-mcp", "ms-playwright-mcp", "coursier", "tuist", "gh", "terraform", "helm", "pipenv", "composer", "whisper", "clip", "modelscope", "lm-evaluation-harness", "lm-studio", "gpt4all", "mole", "poo"]
cost = "rebuild"
warm_days = 30
tags = ["cache", "cli"]
stacks = ["macos"]
description = "Tool caches in ~/.cache that no specific rule covers."
