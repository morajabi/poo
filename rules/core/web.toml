# JavaScript, TypeScript and web frameworks.
# Framework extras, monorepo tools, static sites and test output live in dev-web.toml.

[[rule]]
id = "node.modules"
name = "node_modules"
bucket = "deps"
group = "Node"
kind = "artifact"
tags = ["node", "dependencies"]
stacks = ["node", "bun", "pnpm", "yarn"]
names = ["node_modules"]
parent_any = ["package.json"]
cost = "redownload"
rebuild = "npm install / pnpm install / bun install / yarn"
warm_days = 30
description = "Installed npm packages. Monorepos and every worktree get their own copy."
recommend = "pnpm and bun hardlink from a global store; poo dedupes hardlinks when sizing."

[[rule]]
id = "node.next"
name = "Next.js build"
bucket = "build"
group = "Next.js"
kind = "artifact"
tags = ["node", "nextjs", "build-output"]
stacks = ["node", "nextjs"]
names = [".next"]
parent_any = ["next.config.*", "package.json"]
cost = "rebuild"
rebuild = "next build / next dev"
description = "Next.js build output and its webpack/turbopack cache."
recommend = ".next/cache alone often holds most of it; dev and build share the folder."

[[rule]]
id = "node.nuxt"
name = "Nuxt build"
bucket = "build"
group = "Nuxt"
kind = "artifact"
tags = ["node", "nuxt", "build-output"]
stacks = ["node", "nuxt"]
names = [".nuxt", ".output"]
parent_any = ["nuxt.config.*"]
cost = "rebuild"
rebuild = "nuxt build / nuxt dev"
description = "Nuxt generated files and output."

[[rule]]
id = "node.sveltekit"
name = "SvelteKit build"
bucket = "build"
group = "Svelte"
kind = "artifact"
tags = ["node", "svelte", "build-output"]
stacks = ["node", "svelte"]
names = [".svelte-kit"]
parent_any = ["svelte.config.*", "package.json"]
cost = "rebuild"
rebuild = "vite build / vite dev"
description = "SvelteKit generated output."

[[rule]]
id = "node.astro"
name = "Astro cache"
bucket = "build"
group = "Astro"
kind = "artifact"
tags = ["node", "astro", "build-output"]
stacks = ["node", "astro"]
names = [".astro"]
parent_any = ["astro.config.*"]
cost = "rebuild"
rebuild = "astro sync / astro build"
description = "Astro generated types and content cache."

[[rule]]
id = "node.turbo"
name = "Turborepo cache"
bucket = "build"
group = "Monorepo caches"
kind = "artifact"
tags = ["node", "turborepo", "monorepo", "build-output"]
stacks = ["node", "turborepo"]
names = [".turbo"]
parent_any = ["turbo.json", "package.json"]
cost = "rebuild"
rebuild = "turbo run <task> (replays from remote cache when configured)"
description = "Local Turborepo task cache and logs."

[[rule]]
id = "node.nx"
name = "Nx cache"
bucket = "build"
group = "Monorepo caches"
kind = "artifact"
tags = ["node", "nx", "monorepo", "build-output"]
stacks = ["node", "nx"]
names = [".nx"]
parent_any = ["nx.json"]
cost = "rebuild"
rebuild = "nx run <task> (or nx reset)"
description = "Nx task cache and workspace data."

[[rule]]
id = "node.parcel"
name = "Parcel cache"
bucket = "build"
group = "Bundler caches"
kind = "artifact"
tags = ["node", "parcel", "bundler-cache"]
stacks = ["node"]
names = [".parcel-cache"]
cost = "rebuild"
rebuild = "parcel build"
description = "Parcel's build cache."

[[rule]]
id = "node.angular"
name = "Angular cache"
bucket = "build"
group = "Angular"
kind = "artifact"
tags = ["node", "angular", "bundler-cache"]
stacks = ["node", "angular"]
names = [".angular"]
parent_any = ["angular.json"]
cost = "rebuild"
rebuild = "ng build / ng serve"
description = "Angular CLI build cache."

[[rule]]
id = "node.gatsby"
name = "Gatsby cache and public"
bucket = "build"
group = "Gatsby"
kind = "artifact"
tags = ["node", "gatsby", "static-site", "build-output"]
stacks = ["node", "gatsby"]
names = [".cache", "public"]
parent_any = ["gatsby-config.*"]
ignored = true
cost = "rebuild"
rebuild = "gatsby build"
description = "Gatsby build cache and generated site."

[[rule]]
id = "node.docusaurus"
name = "Docusaurus build"
bucket = "build"
group = "Docs sites"
kind = "artifact"
tags = ["node", "docusaurus", "static-site", "build-output"]
stacks = ["node"]
names = [".docusaurus", "build"]
parent_any = ["docusaurus.config.*"]
children_any = ["index.html", "assets", "404.html", "sitemap.xml", "client-modules.js", "routes.js", "registry.js", "routesChunkNames.json", "globalData.json", "i18n.json", "docusaurus.config.mjs"]
cost = "rebuild"
rebuild = "docusaurus build"
description = "Docusaurus generated files."

[[rule]]
id = "node.storybook"
name = "Storybook static build"
bucket = "build"
group = "Bundler caches"
kind = "artifact"
tags = ["node", "storybook", "build-output"]
stacks = ["node", "storybook"]
names = ["storybook-static"]
parent_any = ["package.json"]
cost = "rebuild"
rebuild = "storybook build"
description = "Static Storybook export."

[[rule]]
id = "node.expo"
name = "Expo state"
bucket = "build"
group = "React Native"
kind = "artifact"
tags = ["node", "react-native", "expo", "build-output"]
stacks = ["node", "react-native"]
names = [".expo", ".expo-shared"]
parent_any = ["app.json", "app.config.*", "package.json"]
cost = "rebuild"
rebuild = "npx expo start"
description = "Expo dev server state and caches."

[[rule]]
id = "node.serverless"
name = "Serverless and SAM builds"
bucket = "build"
group = "Cloud deploy"
kind = "artifact"
tags = ["node", "deploy", "build-output"]
stacks = ["node"]
names = [".serverless", ".aws-sam", ".open-next", ".netlify", ".vercel"]
parent_any = ["serverless.yml", "serverless.ts", "template.yaml", "template.yml", "package.json", "netlify.toml", "vercel.json", "open-next.config.ts"]
ignored = true
cost = "rebuild"
rebuild = "Rebuilt by the next deploy or local build (serverless package, sam build, vercel build)"
description = "Deploy packaging output from Serverless, SAM, OpenNext, Netlify and Vercel."

[[rule]]
id = "node.wrangler"
name = "Wrangler state"
bucket = "build"
group = "Cloud deploy"
kind = "artifact"
tags = ["node", "cloudflare", "deploy", "data"]
stacks = ["node"]
names = [".wrangler"]
parent_any = ["wrangler.toml", "wrangler.json", "wrangler.jsonc"]
cost = "data"
tier = "review"
description = "Cloudflare Wrangler local state, including local D1, KV and R2 data used in dev."
recommend = ".wrangler/tmp is safe; .wrangler/state holds your local databases and buckets."

[[rule]]
id = "node.dist"
name = "JS build output (dist, build, out)"
bucket = "build"
group = "JS build output"
kind = "artifact"
tags = ["node", "build-output"]
stacks = ["node", "bun", "deno"]
names = ["dist", "build", "out", "lib", "es", "cjs", "esm", ".output"]
parent_any = ["package.json"]
children_any = ["*.js", "*.mjs", "*.cjs", "*.css", "*.html", "*.map", "*.d.ts", "*.wasm", "assets", "static", "chunks", "server", "client", "_next", "_app", "types", "browser", "node"]
ignored = true
cost = "rebuild"
rebuild = "npm run build"
description = "Bundler output. Only matched when git ignores the folder, so committed dist folders stay."

[[rule]]
id = "node.coverage"
name = "Test coverage and reports"
bucket = "build"
group = "Test output"
kind = "artifact"
tags = ["node", "playwright", "test-output"]
stacks = ["node", "playwright", "cypress"]
names = ["coverage", ".nyc_output", "test-results", "playwright-report", "blob-report"]
parent_any = ["package.json", "playwright.config.*", "cypress.config.*", "vitest.config.*", "jest.config.*"]
ignored = true
cost = "none"
description = "Coverage reports, Playwright and Cypress results."

[[rule]]
id = "node.cache-dir"
name = "Project .cache folders"
bucket = "build"
group = "Bundler caches"
kind = "artifact"
tags = ["node", "bundler-cache"]
stacks = ["node"]
names = [".cache", ".eslintcache", ".vite", ".rollup.cache", ".webpack-cache", ".swc"]
parent_any = ["package.json"]
ignored = true
cost = "rebuild"
rebuild = "Rebuilt by the next build, lint or dev server run"
description = "Bundler and linter caches inside a JS project."

[[rule]]
id = "npm.cache"
name = "npm cache"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["node", "npm", "package-cache"]
stacks = ["node"]
paths = ["~/.npm/_cacache", "~/.npm/_npx", "~/.npm/_prebuilds"]
cost = "redownload"
rebuild = "Refilled by the next npm install or npx"
warm_days = 30
description = "npm's content cache and npx installs."

[[rule]]
id = "npm.logs"
name = "npm logs"
bucket = "junk"
group = "Logs"
kind = "path"
tags = ["node", "npm", "logs"]
stacks = ["node"]
paths = ["~/.npm/_logs"]
cost = "none"
contents = true
description = "Debug logs npm writes on every run."

[[rule]]
id = "pnpm.store"
name = "pnpm store"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["node", "pnpm", "package-cache"]
stacks = ["node", "pnpm"]
paths = ["~/Library/pnpm/store", "~/.local/share/pnpm/store", "~/.pnpm-store/v*"]
running_apps = ["pnpm"]
cost = "redownload"
clean_command = ["pnpm", "store", "prune"]
rebuild = "pnpm install"
warm_days = 30
description = "Content-addressed store pnpm hardlinks node_modules from. `pnpm store prune` removes unreferenced packages."

[[rule]]
id = "yarn.cache"
name = "Yarn cache"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["node", "yarn", "package-cache"]
stacks = ["node", "yarn"]
paths = ["~/Library/Caches/Yarn", "~/.cache/yarn"]
cost = "redownload"
rebuild = "yarn install"
warm_days = 30
description = "Yarn classic cache."

[[rule]]
id = "yarn.berry-cache"
name = "Yarn Berry global cache"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["node", "yarn", "package-cache"]
stacks = ["node", "yarn"]
paths = ["~/.yarn/berry/cache"]
cost = "redownload"
tier = "review"
rebuild = "yarn install"
description = "With Plug'n'Play this cache IS the installed dependencies of your projects. Clean only if no PnP project uses the global cache."

[[rule]]
id = "bun.cache"
name = "Bun install cache"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["bun", "package-cache"]
stacks = ["bun", "node"]
paths = ["~/.bun/install/cache"]
cost = "redownload"
rebuild = "bun install"
warm_days = 30
description = "Bun's global package cache."

[[rule]]
id = "deno.cache"
name = "Deno cache"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["deno", "package-cache"]
stacks = ["deno"]
paths = ["~/Library/Caches/deno", "~/.cache/deno"]
cost = "redownload"
rebuild = "deno install / deno cache"
warm_days = 30
description = "Deno module, npm and compile cache."

[[rule]]
id = "node.versions"
name = "Node.js versions"
bucket = "caches"
group = "Node versions"
kind = "path"
tags = ["node", "toolchain"]
stacks = ["node"]
paths = ["~/.nvm/versions/node", "~/.local/share/fnm/node-versions", "~/Library/Application Support/fnm/node-versions", "~/.volta/tools/image/node", "~/.asdf/installs/nodejs", "~/.local/share/mise/installs/node", "~/.n/n/versions/node", "~/Library/pnpm/nodejs"]
each = true
cost = "redownload"
tier = "review"
rebuild = "nvm/fnm/volta/mise install <version>"
description = "Node versions installed by nvm, fnm, volta, asdf, mise or pnpm env. Global npm packages live inside each version."
recommend = "Keep versions your projects pin in .nvmrc, .node-version or package.json engines."

[[rule]]
id = "node.gyp"
name = "node-gyp headers"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["node", "package-cache"]
stacks = ["node"]
paths = ["~/Library/Caches/node-gyp", "~/.cache/node-gyp", "~/.node-gyp/*", "~/.electron-gyp/*"]
cost = "redownload"
rebuild = "Downloaded again by the next native addon build"
warm_days = 30
description = "Node headers for native addon builds, one folder per Node version."

[[rule]]
id = "node.corepack"
name = "Corepack package managers"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["node", "corepack", "toolchain"]
stacks = ["node", "pnpm", "yarn"]
paths = ["~/.cache/node/corepack", "~/Library/Caches/node/corepack"]
cost = "redownload"
rebuild = "Fetched again on the next pnpm or yarn call"
warm_days = 30
description = "Package manager binaries fetched by corepack."

[[rule]]
id = "browsers.playwright"
name = "Playwright browsers"
bucket = "caches"
group = "Test browsers"
kind = "path"
tags = ["node", "playwright", "browsers"]
stacks = ["node", "playwright", "python"]
paths = ["~/Library/Caches/ms-playwright"]
each = true
cost = "redownload"
rebuild = "npx playwright install"
warm_days = 30
description = "Browser builds downloaded per Playwright version; old ones linger."
recommend = "npx playwright uninstall removes browsers no installed Playwright version uses."

[[rule]]
id = "browsers.puppeteer"
name = "Puppeteer browsers"
bucket = "caches"
group = "Test browsers"
kind = "path"
tags = ["node", "puppeteer", "browsers"]
stacks = ["node"]
paths = ["~/.cache/puppeteer", "~/Library/Caches/puppeteer"]
cost = "redownload"
rebuild = "npx puppeteer browsers install chrome"
warm_days = 30
description = "Chrome builds downloaded by Puppeteer."

[[rule]]
id = "browsers.cypress"
name = "Cypress binaries"
bucket = "caches"
group = "Test browsers"
kind = "path"
tags = ["node", "cypress", "browsers"]
stacks = ["node", "cypress"]
paths = ["~/Library/Caches/Cypress"]
each = true
cost = "redownload"
rebuild = "npx cypress install"
warm_days = 30
description = "Cypress app versions, one per version any project installed."
recommend = "npx cypress cache prune keeps only the version the current project uses."

[[rule]]
id = "electron.cache"
name = "Electron downloads"
bucket = "caches"
group = "Electron"
kind = "path"
tags = ["node", "electron", "package-cache"]
stacks = ["node"]
paths = ["~/Library/Caches/electron", "~/Library/Caches/electron-builder", "~/.cache/electron"]
cost = "redownload"
rebuild = "Downloaded again by the next electron install or electron-builder run"
warm_days = 30
description = "Electron binaries and builder tools."

[[rule]]
id = "typescript.cache"
name = "TypeScript types cache"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["node", "typescript", "language-server"]
stacks = ["node"]
paths = ["~/Library/Caches/typescript"]
cost = "redownload"
rebuild = "Fetched again by tsserver"
warm_days = 30
description = "Type definitions fetched by tsserver for automatic type acquisition."

[[rule]]
id = "turbo.global"
name = "Turborepo global cache"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["node", "turborepo", "monorepo"]
stacks = ["node", "turborepo"]
paths = ["~/Library/Caches/turbo", "~/Library/Application Support/turborepo"]
cost = "rebuild"
rebuild = "Refilled by the next turbo run"
warm_days = 14
description = "Turborepo daemon and cache data."

[[rule]]
id = "browsers.selenium"
name = "Selenium drivers and browsers"
bucket = "caches"
group = "Test browsers"
kind = "path"
tags = ["browsers", "testing", "selenium"]
stacks = ["python", "java", "node"]
paths = ["~/.cache/selenium", "~/.wdm/drivers"]
cost = "redownload"
rebuild = "Selenium Manager (or webdriver-manager) downloads them again on the next test run"
warm_days = 30
description = "ChromeDriver, GeckoDriver and the Chrome for Testing and Firefox builds Selenium Manager and webdriver-manager downloaded."

[[rule]]
id = "node.prisma-engines"
name = "Prisma engines"
bucket = "caches"
group = "Node"
kind = "path"
tags = ["node", "prisma", "database", "toolchain"]
stacks = ["node"]
paths = ["~/.cache/prisma"]
cost = "redownload"
rebuild = "Downloaded again by the next prisma generate"
warm_days = 30
description = "Query and schema engine binaries Prisma downloads per version."
