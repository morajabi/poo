# Per-app caches for common macOS apps: chat and meetings, mail and office, media and
# design, games, notes, cloud sync and app updaters. Specific paths here win over the
# generic ~/Library/Caches and Application Support sweeps in system.toml, and add a
# running-app check so nothing is cleaned while its app is open.
# Never matched: messages, mailboxes, vaults, notes, libraries, projects, offline
# downloads you chose to keep, cookies, Local Storage and IndexedDB.

# ---------------------------------------------------------------------------
# Kept on purpose
# ---------------------------------------------------------------------------

[[rule]]
id = "app.protected-caches"
name = "Password manager and VPN app caches (kept)"
bucket = "system"
group = "App caches"
kind = "path"
paths = [
  "~/Library/Application Support/{1Password,1Password 7,Bitwarden,Dashlane,Enpass,KeePassXC,Proton Pass,Proton VPN,ProtonVPN,Mullvad VPN,NordVPN,ExpressVPN,Surfshark,Windscribe,Tailscale,mihomo-party,Clash Verge,clash-verge,ClashX,ClashX Pro}/{Cache,Code Cache,GPUCache,DawnCache,DawnGraphiteCache,DawnWebGPUCache,GrShaderCache,GraphiteDawnCache,ShaderCache,GPUPersistentCache}",
  "~/Library/Application Support/{1Password,Bitwarden,Dashlane,Proton Pass,Mullvad VPN,mihomo-party,Clash Verge,clash-verge}/Service Worker/{CacheStorage,ScriptCache}",
  "~/Library/Application Support/{1Password,Bitwarden,Dashlane,Proton Pass}/Partitions/*/{Cache,Code Cache,GPUCache}",
]
cost = "rebuild"
tier = "protected"
tags = ["password-managers", "vpn", "protected"]
stacks = ["macos"]
description = "Electron caches of password managers and VPN apps, claimed here so the generic Electron sweep never picks them up; poo never cleans them."

# ---------------------------------------------------------------------------
# App updaters
# ---------------------------------------------------------------------------

[[rule]]
id = "app.electron-update-staging"
name = "Staged Electron app updates"
bucket = "system"
group = "App updaters"
kind = "path"
paths = ["~/Library/Caches/*.ShipIt"]
cost = "none"
contents = true
min_age_days = 7
tags = ["updaters", "electron", "shipit"]
stacks = ["macos", "electron"]
description = "Update downloads and logs that Squirrel's ShipIt leaves behind for Electron apps (Slack, Claude, GitHub Desktop...) once a week has passed."

[[rule]]
id = "app.sparkle-update-staging"
name = "Staged Sparkle app updates"
bucket = "system"
group = "App updaters"
kind = "path"
paths = [
  "~/Library/Caches/*/org.sparkle-project.Sparkle/Installation",
  "~/Library/Caches/*/org.sparkle-project.Sparkle/PersistentDownloads",
]
cost = "none"
contents = true
min_age_days = 14
tags = ["updaters", "sparkle"]
stacks = ["macos"]
description = "Update archives that Sparkle-based apps downloaded or unpacked but never finished installing, after two weeks."
recommend = "A pending update is downloaded again the next time the app checks; nothing about the installed app changes."

[[rule]]
id = "app.microsoft-autoupdate"
name = "Microsoft AutoUpdate caches"
bucket = "system"
group = "App updaters"
kind = "path"
paths = ["~/Library/Caches/com.microsoft.autoupdate*", "~/Library/Caches/Microsoft/MAU*"]
cost = "redownload"
contents = true
running_apps = ["Microsoft AutoUpdate", "Microsoft Update Assistant"]
warm_days = 14
tags = ["updaters", "microsoft", "office"]
stacks = ["macos"]
description = "Update packages and catalogs Microsoft AutoUpdate downloaded for Office, Edge, Teams and Defender."

[[rule]]
id = "app.microsoft-autoupdate-system"
name = "Microsoft AutoUpdate system downloads"
bucket = "system"
group = "App updaters"
kind = "path"
paths = ["/Library/Caches/com.microsoft.autoupdate.helper", "/Library/Caches/com.microsoft.autoupdate.fba"]
system = true
enabled = false
cost = "redownload"
contents = true
running_apps = ["Microsoft AutoUpdate", "Microsoft Update Assistant"]
warm_days = 14
tags = ["updaters", "microsoft", "office", "needs-admin"]
stacks = ["macos"]
description = "Update payloads Microsoft's privileged updater keeps in /Library/Caches; off by default because the files belong to root and need admin rights."

