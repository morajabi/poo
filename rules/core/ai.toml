# Coding agents, AI desktop apps and VS Code-family editors.
# Local models live in tools-models.toml; other editors and IDEs in tools-editors.toml.
# VS Code-family caches stay here so these exact rules win over the generic Electron
# cache globs in system.toml (files load in name order and the first exact claim wins).

# ---------------------------------------------------------------------------
# Agent workspace managers that keep worktrees outside your dev roots.
# (Claude, Codex, Conductor, Cursor, T3 Code, Superset, Crystal, Vibe Kanban,
# OpenCode and Sculptor homes are in mod.toml.)
# ---------------------------------------------------------------------------

[[worktree_home]]
path = "~/.claude-squad/worktrees"
agent = "claude-squad"

[[worktree_home]]
path = "~/.windsurf/worktrees"
agent = "windsurf"

[[worktree_home]]
path = "~/.local/share/opencode/worktree"
agent = "opencode"

[[worktree_home]]
path = "$TMPDIR/vibe-kanban/worktrees"
agent = "vibe-kanban"

[[worktree_home]]
path = "~/.cmux/src"
agent = "cmux"

[[worktree_home]]
path = "~/.mux/src"
agent = "mux"

[[worktree_home]]
path = "~/.config/container-use/worktrees"
agent = "container-use"

# ---------------------------------------------------------------------------
# Claude Code and the Claude app
# ---------------------------------------------------------------------------

[[rule]]
id = "claude.cli-versions"
name = "Old Claude Code versions"
bucket = "ai"
group = "Agent CLIs"
kind = "provider"
provider = "versions"
params.path = "~/.local/share/claude/versions"
params.active = ["~/.local/bin/claude"]
params.keep = 1
cost = "none"
action = "delete"
rebuild = "claude install <version>"
tags = ["ai", "agent", "claude", "old-versions"]
stacks = ["ai", "claude"]
description = "Claude Code keeps every downloaded version; poo keeps the one ~/.local/bin/claude points to and the newest other one."

[[rule]]
id = "claude.npm-local-install"
name = "Legacy Claude Code local install"
bucket = "ai"
group = "Agent CLIs"
kind = "path"
paths = ["~/.claude/local"]
cost = "redownload"
tier = "review"
rebuild = "claude migrate-installer"
tags = ["ai", "agent", "claude", "old-versions"]
stacks = ["ai", "claude"]
description = "The npm-based install Claude Code used before the native installer, left behind once ~/.local/bin/claude is the native build."
recommend = "Check `which claude` and your shell aliases first: if they point into ~/.claude/local you still use it."

[[rule]]
id = "claude.desktop-code-versions"
name = "Claude app's bundled Claude Code"
bucket = "ai"
group = "Agent CLIs"
kind = "provider"
provider = "versions"
params.path = "~/Library/Application Support/Claude/claude-code"
params.keep = 2
cost = "none"
action = "delete"
running_apps = ["Claude"]
rebuild = "the Claude app downloads the version it needs on the next Code session"
tags = ["ai", "agent", "claude", "old-versions"]
stacks = ["ai", "claude"]
description = "Older Claude Code builds the Claude desktop app downloaded; the two newest are kept."

[[rule]]
id = "claude.transcripts"
name = "Claude Code transcripts"
bucket = "ai"
group = "Agent history"
kind = "path"
paths = ["~/.claude/projects"]
each = true
cost = "data"
tier = "review"
tags = ["ai", "agent", "claude", "history"]
stacks = ["ai", "claude"]
description = "Conversation history per project that Claude Code uses for resume and memory; projects you no longer work on can go."

[[rule]]
id = "claude.file-history"
name = "Claude Code file history"
bucket = "ai"
group = "Agent history"
kind = "path"
paths = ["~/.claude/file-history"]
cost = "data"
tier = "review"
tags = ["ai", "agent", "claude", "history"]
stacks = ["ai", "claude"]
description = "Snapshots Claude Code keeps so it can rewind edits."

[[rule]]
id = "claude.scratch"
name = "Claude Code scratch state"
bucket = "ai"
group = "Agent caches"
kind = "path"
paths = ["~/.claude/shell-snapshots", "~/.claude/debug", "~/.claude/statsig", "~/.claude/todos", "~/.claude/paste-cache", "~/.claude/telemetry", "~/.claude/session-env", "~/.claude/downloads", "~/.cache/claude/staging"]
cost = "none"
contents = true
min_age_days = 7
tags = ["ai", "agent", "claude", "cache", "logs"]
stacks = ["ai", "claude"]
description = "Shell snapshots, debug logs, todo files, unsent telemetry and update staging from sessions older than a week."

[[rule]]
id = "claude.mcp-logs"
name = "Claude Code MCP logs"
bucket = "junk"
group = "Logs"
kind = "path"
paths = ["~/Library/Caches/claude-cli-nodejs"]
each = true
cost = "none"
tags = ["ai", "agent", "claude", "logs", "mcp"]
stacks = ["ai", "claude"]
description = "MCP server logs Claude Code writes per project on every session."

[[rule]]
id = "claude.plugin-marketplaces"
name = "Claude Code plugin marketplaces"
bucket = "ai"
group = "Agent caches"
kind = "path"
paths = ["~/.claude/plugins/marketplaces"]
each = true
cost = "redownload"
tier = "review"
rebuild = "claude plugin marketplace update"
tags = ["ai", "agent", "claude", "plugins"]
stacks = ["ai", "claude"]
description = "Git clones of the plugin marketplaces you added; Claude Code clones them again on update."

[[rule]]
id = "claude.plugin-cache"
name = "Claude Code plugin cache"
bucket = "ai"
group = "Agent caches"
kind = "path"
paths = ["~/.claude/plugins/cache"]
each = true
cost = "redownload"
tier = "review"
rebuild = "reinstall the plugin with /plugin"
tags = ["ai", "agent", "claude", "plugins"]
stacks = ["ai", "claude"]
description = "Installed plugin payloads per marketplace, including versions that updates superseded."

[[rule]]
id = "desktop.claude"
name = "Claude app caches"
bucket = "ai"
group = "AI apps"
kind = "path"
paths = [
  "~/Library/Application Support/Claude/Cache",
  "~/Library/Application Support/Claude/Code Cache",
  "~/Library/Application Support/Claude/GPUCache",
  "~/Library/Application Support/Claude/DawnGraphiteCache",
  "~/Library/Application Support/Claude/DawnWebGPUCache",
  "~/Library/Application Support/Claude/GraphiteDawnCache",
  "~/Library/Application Support/Claude/Shared Dictionary",
  "~/Library/Application Support/Claude/Crashpad/completed",
  "~/Library/Application Support/Claude/sentry",
  "~/Library/Caches/com.anthropic.claudefordesktop",
]
cost = "rebuild"
running_apps = ["Claude"]
warm_days = 7
tags = ["ai", "claude", "cache", "electron"]
stacks = ["ai", "claude"]
description = "Chromium caches and crash reports of the Claude desktop app."

[[rule]]
id = "desktop.claude-logs"
name = "Claude app logs"
bucket = "junk"
group = "Logs"
kind = "path"
paths = ["~/Library/Logs/Claude"]
cost = "none"
contents = true
tags = ["ai", "claude", "logs", "mcp"]
stacks = ["ai", "claude"]
description = "Main and MCP server logs of the Claude desktop app."

[[rule]]
id = "desktop.claude-vm"
name = "Claude app VM bundles"
bucket = "ai"
group = "AI apps"
kind = "path"
paths = ["~/Library/Application Support/Claude/vm_bundles"]
each = true
cost = "redownload"
running_apps = ["Claude"]
warm_days = 14
rebuild = "the Claude app downloads the bundle again when it needs a sandbox"
tags = ["ai", "claude", "vm", "disk-image"]
stacks = ["ai", "claude"]
description = "Sandbox VM images the Claude app downloads for code execution."

[[rule]]
id = "desktop.claude-sessions"
name = "Claude app agent sessions"
bucket = "ai"
group = "Agent history"
kind = "path"
paths = ["~/Library/Application Support/Claude/claude-code-sessions", "~/Library/Application Support/Claude/local-agent-mode-sessions"]
cost = "data"
tier = "review"
tags = ["ai", "agent", "claude", "history"]
stacks = ["ai", "claude"]
description = "Sessions and transcripts the Claude app keeps for its Code and local agent modes."

# ---------------------------------------------------------------------------
# Codex CLI and app
# ---------------------------------------------------------------------------

[[rule]]
id = "codex.daemon-releases"
name = "Old Codex app-server releases"
bucket = "ai"
group = "Agent CLIs"
kind = "provider"
provider = "versions"
params.path = "~/.codex/packages/app-server-daemon/releases"
params.active = ["~/.codex/packages/app-server-daemon/current"]
params.keep = 1
cost = "none"
action = "delete"
running_apps = ["Codex", "codex"]
tags = ["ai", "agent", "codex", "old-versions"]
stacks = ["ai", "codex"]
description = "Superseded Codex app-server daemon releases; the current one and the newest other are kept."

[[rule]]
id = "codex.artifact-runtimes"
name = "Old Codex artifact runtimes"
bucket = "ai"
group = "Agent CLIs"
kind = "provider"
provider = "versions"
params.path = "~/Library/Application Support/Codex/artifact-sessions/runtime-generations"
params.pattern = "generation-*"
params.keep = 1
cost = "none"
action = "delete"
tags = ["ai", "agent", "codex", "old-versions", "runtime"]
stacks = ["ai", "codex"]
description = "Runtime generations the Codex app unpacked for artifact sessions; only the newest is in use."

[[rule]]
id = "codex.sessions"
name = "Codex sessions"
bucket = "ai"
group = "Agent history"
kind = "path"
paths = ["~/.codex/sessions", "~/.codex/archived_sessions"]
cost = "data"
tier = "review"
tags = ["ai", "agent", "codex", "history"]
stacks = ["ai", "codex"]
description = "Codex rollout transcripts that resume and history read."

[[rule]]
id = "codex.state-dbs"
name = "Codex databases"
bucket = "ai"
group = "Agent history"
kind = "path"
paths = ["~/.codex/*.sqlite"]
cost = "data"
action = "none"
tags = ["ai", "agent", "codex", "history"]
stacks = ["ai", "codex"]
description = "Codex's thread history, state and log databases, shown for their size and never deleted by poo because Codex keeps them open."

[[rule]]
id = "codex.logs"
name = "Codex logs"
bucket = "junk"
group = "Logs"
kind = "path"
paths = ["~/.codex/log"]
cost = "none"
contents = true
min_age_days = 7
tags = ["ai", "agent", "codex", "logs"]
stacks = ["ai", "codex"]
description = "Codex CLI logs that have not been written for a week; the app's logs in ~/Library/Logs are covered by App logs."

[[rule]]
id = "codex.runtimes"
name = "Codex runtimes"
bucket = "ai"
group = "Agent caches"
kind = "path"
paths = ["~/.cache/codex-runtimes"]
each = true
cost = "redownload"
running_apps = ["Codex", "codex"]
warm_days = 14
rebuild = "Codex downloads the runtime again on the next run"
tags = ["ai", "agent", "codex", "runtime"]
stacks = ["ai", "codex"]
description = "Sandboxed runtimes Codex downloads."

[[rule]]
id = "codex.cache"
name = "Codex caches"
bucket = "ai"
group = "Agent caches"
kind = "path"
paths = ["~/.codex/cache"]
cost = "redownload"
running_apps = ["Codex", "codex"]
warm_days = 7
tags = ["ai", "agent", "codex", "cache"]
stacks = ["ai", "codex"]
description = "Plugin catalog, app directory and tool caches Codex fetches again."

[[rule]]
id = "codex.tmp"
name = "Codex staging folders"
bucket = "ai"
group = "Agent caches"
kind = "path"
paths = ["~/.codex/.tmp"]
each = true
exclude = ["*.lock", "*.sha"]
cost = "redownload"
tier = "review"
min_age_days = 2
tags = ["ai", "agent", "codex", "staging"]
stacks = ["ai", "codex"]
description = "Temporary git clones and the plugin marketplace checkouts Codex syncs under ~/.codex/.tmp; Codex reads the synced checkouts, so delete them only with Codex closed."

[[rule]]
id = "codex.plugin-cache"
name = "Codex plugin cache"
bucket = "ai"
group = "Agent caches"
kind = "path"
paths = ["~/.codex/plugins/cache"]
each = true
cost = "redownload"
tier = "review"
tags = ["ai", "agent", "codex", "plugins"]
stacks = ["ai", "codex"]
description = "Installed Codex plugins per marketplace, including versions updates replaced."

[[rule]]
id = "codex.plugin-staging"
name = "Codex plugin install staging"
bucket = "ai"
group = "Agent caches"
kind = "path"
paths = ["~/.codex/plugins/.remote-plugin-install-staging"]
cost = "none"
min_age_days = 1
tags = ["ai", "agent", "codex", "plugins", "staging"]
stacks = ["ai", "codex"]
description = "Plugin downloads Codex staged before installing them; its app updates are covered by Staged Sparkle app updates."

[[rule]]
id = "desktop.codex"
name = "Codex app caches"
bucket = "ai"
group = "AI apps"
kind = "path"
paths = [
  "~/Library/Caches/com.openai.codex",
  "~/Library/Caches/Codex",
  "~/Library/Application Support/Codex/Crashpad/completed",
  "~/Library/Application Support/Codex/component_crx_cache",
  "~/Library/Application Support/Codex/GraphiteDawnCache",
  "~/Library/Application Support/Codex/Code Cache",
  "~/Library/Application Support/Codex/GPUCache",
]
cost = "rebuild"
running_apps = ["Codex", "ChatGPT", "Codex (Aperitif)"]
warm_days = 7
tags = ["ai", "codex", "cache", "electron"]
stacks = ["ai", "codex"]
description = "HTTP, component and GPU caches of the Codex desktop app."

[[rule]]
id = "desktop.ai-apps"
name = "ChatGPT app caches"
bucket = "ai"
group = "AI apps"
kind = "path"
paths = ["~/Library/Caches/com.openai.chat", "~/Library/Caches/com.openai.atlas"]
cost = "rebuild"
running_apps = ["ChatGPT", "ChatGPT Atlas"]
warm_days = 7
tags = ["ai", "chatgpt", "cache"]
stacks = ["ai", "chatgpt"]
description = "Caches of the ChatGPT and ChatGPT Atlas apps."

