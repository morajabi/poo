[[rule]]
id = "editor.extensions"
name = "Editor extensions"
bucket = "ai"
group = "Editors"
kind = "provider"
provider = "exec"
params.timeout = 20
params.command = ["/bin/sh", "-c", '''
sep=""
printf '{"items":['
for d in "$HOME/.vscode/extensions" "$HOME/.vscode-insiders/extensions" "$HOME/.vscode-oss/extensions" "$HOME/.positron/extensions" "$HOME/.cursor/extensions" "$HOME/.windsurf/extensions" "$HOME/.kiro/extensions" "$HOME/.trae/extensions" "$HOME/.antigravity/extensions"; do
  [ -d "$d" ] || continue
  obs=" "
  [ -f "$d/.obsolete" ] && obs=" $(sed -e 's/[{}"]//g' -e 's/:true//g' -e 's/,/ /g' "$d/.obsolete") "
  for p in "$d"/*; do
    [ -d "$p" ] && [ ! -L "$p" ] || continue
    n=${p##*/}
    case "$obs" in
      *" $n "*) printf '%s{"path":"%s","name":"%s (obsolete)","cost":"none","reasons":["listed in .obsolete: the editor already replaced or uninstalled it"]}' "$sep" "$p" "$n" ;;
      *) printf '%s{"path":"%s","name":"%s","tier":"review"}' "$sep" "$p" "$n" ;;
    esac
    sep=","
  done
done
printf ']}'
''']
cost = "redownload"
action = "delete"
running_apps = ["Code", "Code - Insiders", "VSCodium", "Positron", "Cursor", "Windsurf", "Kiro", "Trae", "Antigravity", "Electron"]
rebuild = "reinstall the extension from the marketplace"
tags = ["editor", "vscode", "extensions", "old-versions"]
stacks = ["vscode"]
description = "Installed VS Code-family extensions, one per version; versions the editor listed in .obsolete are junk, the rest need a look."
recommend = "Obsolete versions are safe to delete once the editor is closed; restarting the editor also removes them."

