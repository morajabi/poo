paths = ["~/Library/Caches/com.apple.Safari", "~/Library/Caches/com.apple.SafariTechnologyPreview", "~/Library/Caches/com.apple.WebKit.Networking"]
cost = "rebuild"
contents = true
running_apps = ["Safari", "Safari Technology Preview"]
warm_days = 7
tags = ["browsers", "safari", "webkit", "cache", "needs-permission"]
stacks = ["browsers", "macos"]
description = "Safari's web cache and the shared WebKit network cache."

