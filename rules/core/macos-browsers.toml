# Web browsers on macOS: HTTP, code, GPU/shader and service worker caches per browser,
# downloaded browser components, on-device AI models and superseded framework versions.
# Cookies, Local Storage, IndexedDB, history, bookmarks and passwords are never matched.
# Crashpad crash reports are handled by junk.crash-reports.
#
# Chromium layout on macOS: the HTTP and code caches live in ~/Library/Caches/<browser>,
# GPU and shader caches and downloaded components in ~/Library/Application Support/<browser>,
# one folder per profile (Default, Profile 1...) plus a few shared folders at the root.

# ---------------------------------------------------------------------------
# Google Chrome (stable, Beta, Dev, Canary, Chrome for Testing)
# ---------------------------------------------------------------------------

[[rule]]
id = "browser.chrome-cache"
name = "Chrome caches"
bucket = "system"
group = "Browsers"
kind = "path"
paths = [
  "~/Library/Caches/Google/Chrome*",
]
cost = "rebuild"
contents = true
running_apps = ["Google Chrome", "Google Chrome Beta", "Google Chrome Dev", "Google Chrome Canary", "Google Chrome for Testing"]
warm_days = 7
tags = ["browsers", "chrome", "chromium", "cache"]
stacks = ["browsers", "macos"]
description = "Chrome's disk cache in ~/Library/Caches, one folder per profile and channel. Readable without extra permissions."
recommend = "Close Chrome first. Sites and offline web apps refill their service worker caches on the next visit; you stay signed in."

[[rule]]
id = "browser.chrome-profile-caches"
name = "Chrome profile caches"
bucket = "system"
group = "Browsers"
kind = "path"
paths = [
  "~/Library/Application Support/Google/Chrome*/*/{Code Cache,GPUCache,DawnCache,DawnGraphiteCache,DawnWebGPUCache,GrShaderCache,GraphiteDawnCache,Application Cache}",
  "~/Library/Application Support/Google/Chrome*/*/Service Worker/{CacheStorage,ScriptCache}",
  "~/Library/Application Support/Google/Chrome*/{ShaderCache,GrShaderCache,GraphiteDawnCache,GPUPersistentCache,component_crx_cache,extensions_crx_cache}",
]
cost = "rebuild"
contents = true
running_apps = ["Google Chrome", "Google Chrome Beta", "Google Chrome Dev", "Google Chrome Canary", "Google Chrome for Testing"]
warm_days = 7
tags = ["browsers", "chrome", "chromium", "cache", "gpu-cache", "service-worker", "needs-permission"]
stacks = ["browsers", "macos"]
description = "Chrome's code, GPU, shader and service worker caches inside the browser profile. macOS protects browser profiles, so poo reads them only with Full Disk Access."
recommend = "Close Chrome first. Sites and offline web apps refill their service worker caches on the next visit; you stay signed in."

[[rule]]
id = "browser.chrome-ai-models"
name = "Chrome on-device AI models"
bucket = "system"
group = "Browsers"
kind = "path"
paths = [
  "~/Library/Application Support/Google/Chrome*/OptGuideOnDeviceModel",
  "~/Library/Application Support/Google/Chrome*/OptGuideOnDeviceClassifierModel",
  "~/Library/Application Support/Google/Chrome*/optimization_guide_model_store",
]
cost = "redownload"
contents = true
running_apps = ["Google Chrome", "Google Chrome Beta", "Google Chrome Dev", "Google Chrome Canary", "Google Chrome for Testing"]
warm_days = 30
tags = ["browsers", "chrome", "ai-models", "needs-permission"]
stacks = ["browsers", "macos"]
description = "Gemini Nano and other on-device models Chrome downloads for its built-in AI features, often several GB."
recommend = "Chrome downloads them again when a feature needs them. Turn the AI features off in chrome://settings to keep them away."

[[rule]]
id = "browser.chrome-old-versions"
name = "Old Chrome framework versions"
bucket = "system"
group = "Browsers"
kind = "provider"
provider = "versions"
params.path = "/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/Versions"
params.pattern = "[0-9]*"
params.active = ["/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/Versions/Current"]
params.keep = 1
system = true
cost = "none"
running_apps = ["Google Chrome"]
tags = ["browsers", "chrome", "old-versions"]
stacks = ["browsers", "macos"]
description = "Superseded Chrome versions left inside the app after self-updates; the current one and the newest other one are always kept."

[[rule]]
id = "browser.google-updater"
name = "Google updater downloads"
bucket = "system"
group = "Browsers"
kind = "path"
paths = ["~/Library/Application Support/Google/GoogleUpdater/crx_cache"]
cost = "redownload"
contents = true
running_apps = ["GoogleUpdater", "Google Chrome"]
warm_days = 7
tags = ["browsers", "chrome", "updaters"]
stacks = ["browsers", "macos"]
description = "Update packages Google's updater downloaded for Chrome and other Google apps."

[[rule]]
id = "browser.google-updater-old-versions"
name = "Old Google updater versions"
bucket = "system"
group = "Browsers"
kind = "provider"
provider = "versions"
params.path = "~/Library/Application Support/Google/GoogleUpdater"
params.pattern = "[0-9]*"
params.active = ["~/Library/Application Support/Google/GoogleUpdater/Current"]
params.keep = 0
cost = "none"
min_age_days = 7
running_apps = ["GoogleUpdater"]
tags = ["browsers", "chrome", "updaters", "old-versions"]
stacks = ["browsers", "macos"]
description = "Previous copies of Google's updater that its Current link no longer points to."

