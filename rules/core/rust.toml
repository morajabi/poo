# Rust, Go, Zig and native toolchains (CMake, Meson, ccache, Bazel).
# More C/C++ and build-system rules live in dev-native.toml.

# ---------------------------------------------------------------------------
# Rust
# ---------------------------------------------------------------------------

[[rule]]
id = "rust.target"
name = "Rust target directories"
bucket = "build"
group = "Rust"
kind = "artifact"
tags = ["rust", "build-output"]
stacks = ["rust"]
names = ["target"]
parent_any = ["Cargo.toml"]
children_any = ["debug", "release", "CACHEDIR.TAG", ".rustc_info.json", "doc", "package", "*-apple-darwin", "*-linux-*", "wasm32-*"]
cost = "rebuild"
rebuild = "cargo build"
warm_days = 14
description = "Compiled Rust output. target/debug/deps keeps every old artifact hash and never shrinks on its own."
recommend = "Set [profile.dev] debug = \"line-tables-only\" and [profile.dev.package.\"*\"] debug = false to roughly halve it. Never share one target dir across worktrees."

[[rule]]
id = "rust.target-custom"
name = "Rust target (custom CARGO_TARGET_DIR)"
bucket = "build"
group = "Rust"
kind = "artifact"
tags = ["rust", "build-output"]
stacks = ["rust"]
names = ["*"]
children_all = [".rustc_info.json"]
children_none = ["Cargo.toml", ".git", "src"]
children_any = ["debug", "release", "CACHEDIR.TAG"]
cost = "rebuild"
rebuild = "cargo build"
warm_days = 14
description = "A cargo target directory under another name (CARGO_TARGET_DIR, build/cargo...)."

[[rule]]
id = "rust.mutants-out"
name = "cargo-mutants output"
bucket = "build"
group = "Rust"
kind = "artifact"
tags = ["rust", "test-output"]
stacks = ["rust"]
names = ["mutants.out", "mutants.out.old"]
parent_any = ["Cargo.toml"]
cost = "none"
description = "Logs and scratch copies left by cargo-mutants runs."

[[rule]]
id = "rust.wasm-pkg"
name = "wasm-pack pkg output"
bucket = "build"
group = "Rust"
kind = "artifact"
tags = ["rust", "wasm", "build-output"]
stacks = ["rust"]
names = ["pkg"]
parent_any = ["Cargo.toml"]
children_any = ["*.wasm", "*_bg.js", "*_bg.wasm.d.ts"]
ignored = true
cost = "rebuild"
rebuild = "wasm-pack build"
description = "The npm package wasm-pack generates from a crate. Only matched when git ignores it."

[[rule]]
id = "rust.cargo-registry"
name = "Cargo registry"
bucket = "caches"
group = "Rust"
kind = "path"
tags = ["rust", "package-cache"]
stacks = ["rust"]
paths = ["~/.cargo/registry/cache", "~/.cargo/registry/src", "~/.cargo/registry/index"]
cost = "redownload"
rebuild = "cargo fetch (or the next cargo build)"
warm_days = 30
description = "Downloaded crates and their unpacked sources."
recommend = "registry/src is only an unpacked copy of registry/cache; it is the cheapest part to drop."

[[rule]]
id = "rust.cargo-git"
name = "Cargo git checkouts"
bucket = "caches"
group = "Rust"
kind = "path"
tags = ["rust", "package-cache"]
stacks = ["rust"]
paths = ["~/.cargo/git/checkouts", "~/.cargo/git/db"]
cost = "redownload"
rebuild = "cargo fetch (or the next cargo build)"
warm_days = 30
description = "Git dependencies fetched by cargo."

[[rule]]
id = "rust.toolchains"
name = "Rust toolchains"
bucket = "caches"
group = "Rust toolchains"
kind = "path"
tags = ["rust", "toolchain"]
stacks = ["rust"]
paths = ["~/.rustup/toolchains"]
each = true
cost = "redownload"
tier = "review"
action = "command"
command = ["rustup", "toolchain", "uninstall", "{name}"]
rebuild = "rustup toolchain install <name>"
description = "Installed toolchains. Old nightlies and pinned versions pile up."
recommend = "Keep the toolchains your projects pin in rust-toolchain.toml."

[[rule]]
id = "rust.rustup-downloads"
name = "rustup downloads"
bucket = "junk"
group = "Installers"
kind = "path"
tags = ["rust", "installer"]
stacks = ["rust"]
paths = ["~/.rustup/downloads", "~/.rustup/tmp"]
cost = "none"
contents = true
description = "Leftover rustup downloads."

[[rule]]
id = "rust.sccache"
name = "sccache"
bucket = "caches"
group = "Rust"
kind = "path"
tags = ["rust", "cpp", "compiler-cache"]
stacks = ["rust", "cmake", "cpp"]
paths = ["~/Library/Caches/Mozilla.sccache", "~/.cache/sccache"]
cost = "rebuild"
rebuild = "Refilled by the next builds that go through sccache"
warm_days = 14
description = "Shared compilation cache."

[[rule]]
id = "rust.wasm-tools"
name = "wasm-pack and Trunk downloads"
bucket = "caches"
group = "Rust"
kind = "path"
tags = ["rust", "wasm", "package-cache"]
stacks = ["rust"]
paths = ["~/Library/Caches/.wasm-pack", "~/.cache/.wasm-pack", "~/Library/Caches/dev.trunkrs.trunk"]
cost = "redownload"
rebuild = "Downloaded again by the next wasm-pack or trunk build"
warm_days = 30
description = "wasm-bindgen, wasm-opt and other tool binaries wasm-pack and Trunk download per version."

# ---------------------------------------------------------------------------
# Go
# ---------------------------------------------------------------------------

[[rule]]
id = "go.build-cache"
name = "Go build cache"
bucket = "caches"
group = "Go"
kind = "path"
tags = ["go", "compiler-cache"]
stacks = ["go"]
paths = ["~/Library/Caches/go-build"]
cost = "rebuild"
rebuild = "Refilled by the next go build or go test"
warm_days = 14
description = "Go compiler and test cache. Go trims entries unused for 5 days, but heavy test runs still grow it."

[[rule]]
id = "go.mod-cache"
name = "Go module cache"
bucket = "caches"
group = "Go"
kind = "path"
tags = ["go", "package-cache"]
stacks = ["go"]
paths = ["~/go/pkg/mod"]
cost = "redownload"
clean_command = ["go", "clean", "-modcache"]
rebuild = "go mod download"
warm_days = 30
description = "Downloaded Go modules (read-only files; cleaned through go clean)."

[[rule]]
id = "go.toolchains"
name = "Go toolchain downloads"
bucket = "caches"
group = "Go"
kind = "path"
tags = ["go", "toolchain"]
stacks = ["go"]
paths = ["~/go/pkg/mod/golang.org/toolchain@*"]
cost = "redownload"
rebuild = "Downloaded again when a go.mod asks for that toolchain (GOTOOLCHAIN=auto)"
warm_days = 30
description = "Go toolchains fetched automatically for go.mod toolchain lines, one per version."

[[rule]]
id = "go.lint-cache"
name = "Go linter and gopls caches"
bucket = "caches"
group = "Go"
kind = "path"
tags = ["go", "lint-cache", "language-server"]
stacks = ["go"]
paths = ["~/Library/Caches/golangci-lint", "~/Library/Caches/gopls", "~/Library/Caches/staticcheck", "~/Library/Caches/goimports"]
cost = "rebuild"
rebuild = "Rebuilt by the next lint run or editor session"
warm_days = 14
description = "golangci-lint, gopls, staticcheck and goimports caches."

[[rule]]
id = "go.sdk-downloads"
name = "Go SDKs from golang.org/dl"
bucket = "caches"
group = "Go versions"
kind = "path"
tags = ["go", "toolchain"]
stacks = ["go"]
paths = ["~/sdk/go1.*", "~/sdk/gotip"]
cost = "redownload"
tier = "review"
rebuild = "go install golang.org/dl/go1.X@latest && go1.X download"
description = "Extra Go versions installed with the golang.org/dl wrappers (about 250 MB each)."

[[rule]]
id = "go.versions"
name = "Go versions"
bucket = "caches"
group = "Go versions"
kind = "path"
tags = ["go", "toolchain"]
stacks = ["go"]
paths = ["~/.gvm/gos", "~/.goenv/versions", "~/.asdf/installs/golang", "~/.local/share/mise/installs/go"]
each = true
cost = "redownload"
tier = "review"
rebuild = "gvm/goenv/asdf/mise install go <version>"
description = "Go versions installed by gvm, goenv, asdf or mise."
recommend = "Keep the versions your go.mod files and .tool-versions pin."

[[rule]]
id = "go.air-tmp"
name = "Air live-reload builds"
bucket = "build"
group = "Go"
kind = "artifact"
tags = ["go", "build-output"]
stacks = ["go"]
names = ["tmp"]
parent_any = [".air.toml", ".air.conf", "air.toml"]
ignored = true
cost = "rebuild"
rebuild = "air"
description = "Binaries and logs Air rebuilds on every save. Only matched when git ignores it."

# ---------------------------------------------------------------------------
# Zig
# ---------------------------------------------------------------------------

[[rule]]
id = "zig.cache"
name = "Zig caches"
bucket = "build"
group = "Zig"
kind = "artifact"
tags = ["zig", "build-output"]
stacks = ["zig"]
names = ["zig-cache", ".zig-cache", "zig-out"]
parent_any = ["build.zig"]
cost = "rebuild"
rebuild = "zig build"
description = "Zig build caches and outputs."

[[rule]]
id = "zig.global-cache"
name = "Zig global cache"
bucket = "caches"
group = "Zig"
kind = "path"
tags = ["zig", "compiler-cache"]
stacks = ["zig"]
paths = ["~/.cache/zig", "~/Library/Caches/zig"]
cost = "rebuild"
rebuild = "Refilled by the next zig build (packages are fetched again)"
warm_days = 14
description = "Zig's global compilation cache and fetched packages."

[[rule]]
id = "zig.versions"
name = "Zig versions"
bucket = "caches"
group = "Zig"
kind = "path"
tags = ["zig", "toolchain"]
stacks = ["zig"]
paths = ["~/.local/share/mise/installs/zig", "~/.asdf/installs/zig"]
each = true
cost = "redownload"
tier = "review"
rebuild = "mise/asdf install zig <version>"
description = "Zig compilers installed by mise or asdf."
recommend = "Zig moves fast and projects pin exact versions; keep the ones your build.zig.zon files need."

[[rule]]
id = "zig.zvm-versions"
name = "Old zvm Zig versions"
bucket = "caches"
group = "Zig"
kind = "provider"
provider = "versions"
tags = ["zig", "toolchain"]
stacks = ["zig"]
params.path = "~/.zvm"
params.pattern = "{[0-9]*,master}"
params.active = ["~/.zvm/bin"]
params.keep = 1
cost = "redownload"
tier = "review"
action = "delete"
rebuild = "zvm install <version>"
description = "Zig versions installed by zvm, except the active one (~/.zvm/bin) and the newest other."

# ---------------------------------------------------------------------------
# C / C++ build trees and compiler caches
# ---------------------------------------------------------------------------

[[rule]]
id = "cmake.build"
name = "CMake build trees"
bucket = "build"
group = "C / C++"
kind = "artifact"
tags = ["cpp", "cmake", "build-output"]
stacks = ["cmake", "cpp"]
names = ["*"]
children_all = ["CMakeCache.txt"]
# An in-source build (`cmake .`) puts CMakeCache.txt next to the sources; never match that.
children_none = ["CMakeLists.txt", ".git"]
cost = "rebuild"
rebuild = "cmake -B <dir> && cmake --build <dir>"
description = "Any folder holding a CMakeCache.txt is a CMake build tree (build/, cmake-build-debug/, out/...)."

[[rule]]
id = "meson.build"
name = "Meson build trees"
bucket = "build"
group = "C / C++"
kind = "artifact"
tags = ["cpp", "meson", "build-output"]
stacks = ["cmake", "cpp"]
names = ["*"]
children_all = ["build.ninja", "meson-private"]
children_none = ["meson.build", ".git"]
cost = "rebuild"
rebuild = "meson setup <dir> && ninja -C <dir>"
description = "Meson build directories."

[[rule]]
id = "ccache.cache"
name = "ccache"
bucket = "caches"
group = "C / C++"
kind = "path"
tags = ["cpp", "compiler-cache"]
stacks = ["cmake", "cpp"]
paths = ["~/Library/Caches/ccache", "~/.cache/ccache", "~/.ccache/*"]
exclude = ["*.conf", "stats"]
cost = "rebuild"
rebuild = "Refilled by the next compiles through ccache"
warm_days = 14
description = "C/C++ compiler cache. The legacy ~/.ccache folder is listed per subfolder so ccache.conf stays."

[[rule]]
id = "bazel.disk-cache"
name = "Bazel caches"
bucket = "caches"
group = "Bazel"
kind = "path"
tags = ["bazel", "compiler-cache"]
stacks = ["bazel"]
paths = ["~/.cache/bazel", "~/Library/Caches/bazelisk", "~/.cache/bazelisk"]
cost = "rebuild"
rebuild = "bazel build (bazelisk downloads Bazel again)"
warm_days = 14
description = "Bazel disk cache and bazelisk downloads."
