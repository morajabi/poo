# Git worktrees, unexplained ignored folders, and git clients and tooling.

[[rule]]
id = "git.worktrees"
name = "Linked git worktrees"
bucket = "worktrees"
group = "Worktrees"
kind = "provider"
provider = "git-worktrees"
cost = "rebuild"
rebuild = "git worktree add <path> <branch> (the branch and its commits stay)"
warm_days = 7
tags = ["git", "worktree", "agent"]
stacks = ["git"]
description = "Whole linked worktrees; removal goes through `git worktree remove`, which refuses uncommitted changes, and branches and commits are kept."
recommend = "Agent worktrees outlive their task. Remove them once the branch is merged or abandoned; build output inside goes with them."

[[rule]]
id = "git.ignored"
name = "Other git-ignored folders"
bucket = "other"
group = "Unclassified ignored"
kind = "provider"
provider = "git-ignored"
params.min_bytes = 100000000
cost = "rebuild"
tier = "review"
tags = ["git", "unclassified"]
stacks = ["git"]
description = "Large folders git ignores that no rule recognizes; never cleaned automatically."
recommend = "Look at what produces them and add a rule in a mod (`poo mods new`) so poo can tier them."

# ---------------------------------------------------------------------------
# GitHub CLI and git clients
# ---------------------------------------------------------------------------

[[rule]]
id = "gh.cache"
name = "GitHub CLI cache"
bucket = "caches"
group = "Git tools"
kind = "path"
paths = ["~/.cache/gh"]
cost = "redownload"
warm_days = 30
tags = ["git", "github", "cache"]
stacks = ["git", "github"]
description = "API responses and workflow run logs the gh CLI caches."

[[rule]]
id = "github-desktop.caches"
name = "GitHub Desktop caches"
bucket = "system"
group = "Git clients"
kind = "path"
paths = ["~/Library/Caches/com.github.GitHubClient", "~/Library/Application Support/GitHub Desktop/logs"]
cost = "rebuild"
running_apps = ["GitHub Desktop"]
warm_days = 14
tags = ["git", "github", "github-desktop", "cache", "logs"]
stacks = ["git", "github"]
description = "HTTP cache and rotated logs of GitHub Desktop; its repository list and settings are untouched."

[[rule]]
id = "gitkraken.caches"
name = "GitKraken caches"
bucket = "system"
group = "Git clients"
kind = "path"
paths = ["~/Library/Caches/com.axosoft.gitkraken", "~/.gitkraken/logs"]
cost = "rebuild"
running_apps = ["GitKraken"]
warm_days = 14
tags = ["git", "gitkraken", "cache", "logs"]
stacks = ["git"]
description = "Caches and logs of GitKraken; profiles and workspaces in ~/.gitkraken stay."

