# ---------------------------------------------------------------------------
# Launchers: how "Ask your agent" hands a prompt to a coding agent or AI app.
# {prompt} is the brief poo writes; terminal launchers run in the item's folder.
# Add your own in a mod, or disable one with enabled = false.
# ---------------------------------------------------------------------------

[[launcher]]
id = "claude-code"
name = "Claude Code"
kind = "terminal"
command = ["claude", "{prompt}"]
detect = ["claude"]
order = 10

[[launcher]]
id = "codex"
name = "Codex CLI"
kind = "terminal"
command = ["codex", "{prompt}"]
detect = ["codex"]
order = 20

[[launcher]]
id = "cursor"
name = "Cursor"
kind = "url"
url = "cursor://anysphere.cursor-deeplink/prompt?text={prompt}"
detect_app = ["Cursor.app"]
order = 30

[[launcher]]
id = "gemini"
name = "Gemini CLI"
kind = "terminal"
command = ["gemini", "-i", "{prompt}"]
detect = ["gemini"]
order = 40

[[launcher]]
id = "opencode"
name = "OpenCode"
kind = "terminal"
command = ["opencode", "--prompt", "{prompt}"]
detect = ["opencode"]
order = 50

[[launcher]]
id = "claude-app"
name = "Claude app"
kind = "url"
url = "claude://claude.ai/new?q={prompt}"
detect_app = ["Claude.app"]
order = 60

[[launcher]]
id = "cursor-agent"
name = "Cursor CLI"
kind = "terminal"
command = ["cursor-agent", "{prompt}"]
detect = ["cursor-agent"]
order = 70

[[launcher]]
id = "copilot"
name = "GitHub Copilot CLI"
kind = "terminal"
command = ["copilot", "-i", "{prompt}"]
detect = ["copilot"]
order = 80

[[launcher]]
id = "qwen"
name = "Qwen Code"
kind = "terminal"
command = ["qwen", "-i", "{prompt}"]
detect = ["qwen"]
order = 90

[[launcher]]
id = "droid"
name = "Factory Droid"
kind = "terminal"
command = ["droid", "{prompt}"]
detect = ["droid"]
order = 100

[[launcher]]
id = "goose"
name = "Goose"
kind = "terminal"
command = ["goose", "run", "--text", "{prompt}", "--interactive"]
detect = ["goose"]
order = 110

[[launcher]]
id = "kiro-cli"
name = "Kiro CLI"
kind = "terminal"
command = ["kiro-cli", "chat", "{prompt}"]
detect = ["kiro-cli"]
order = 120
