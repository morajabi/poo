markers = ["go.mod"]
tools = ["go"]

[[stack]]
id = "gradle"
name = "Gradle / Android"
markers = ["build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"]
tools = ["gradlew", "gradle"]

[[stack]]
id = "maven"
name = "Maven"
markers = ["pom.xml"]
tools = ["mvn"]

[[stack]]
id = "scala"
name = "Scala"
markers = ["build.sbt"]
tools = ["sbt", "mill"]

[[stack]]
id = "ruby"
name = "Ruby"
markers = ["Gemfile"]
tools = ["bundle", "rake"]

[[stack]]
id = "php"
name = "PHP"
markers = ["composer.json"]
tools = ["composer"]

[[stack]]
id = "elixir"
name = "Elixir"
markers = ["mix.exs"]
tools = ["mix"]

[[stack]]
id = "haskell"
name = "Haskell"
markers = ["stack.yaml", "cabal.project", "*.cabal"]
tools = ["cabal", "stack", "ghc"]

[[stack]]
id = "dotnet"
name = ".NET"
