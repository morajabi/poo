id = "core"
name = "poo core"
description = "Built-in knowledge: buckets, plans, stacks, worktree homes, guards and rules for dev tools, AI agents, containers and macOS."
priority = 0

# ---------------------------------------------------------------------------
# Buckets: top-level sections. Rename, reorder, recolor or hide them from
# config.toml, `poo buckets`, MCP or the app.
# ---------------------------------------------------------------------------

[[bucket]]
id = "build"
name = "Build output"
order = 10
color = "#F28C28"
symbol = "hammer"
description = "Compiled output inside your projects and worktrees: target, .build, dist, .next and friends."

[[bucket]]
id = "xcode"
name = "Xcode & Apple SDKs"
order = 20
color = "#2F7CF6"
symbol = "hammer.circle"
description = "DerivedData, simulators, runtimes, device support and other Apple developer data."

[[bucket]]
id = "android"
name = "Android SDK & emulators"
order = 25
color = "#3DDC84"
symbol = "smartphone"
description = "Emulators, system images, NDKs and other Android SDK pieces."

[[bucket]]
id = "worktrees"
name = "Worktrees"
order = 30
color = "#8E5CF7"
symbol = "arrow.triangle.branch"
description = "Linked git worktrees from Claude, Codex, Conductor and friends, beyond the build output inside them."

[[bucket]]
id = "deps"
name = "Dependencies"
order = 40
color = "#34C759"
symbol = "shippingbox"
description = "Installed packages inside projects: node_modules, virtualenvs, Pods, vendor."

[[bucket]]
id = "caches"
name = "Package & tool caches"
order = 50
color = "#14B8A6"
symbol = "archivebox"
description = "Global caches of package managers, compilers and toolchains."

[[bucket]]
id = "ai"
name = "AI tools & models"
order = 60
color = "#EC4899"
symbol = "sparkles"
description = "Coding agents, editors and local model weights."

[[bucket]]
id = "containers"
name = "Containers & VMs"
order = 70
color = "#06B6D4"
symbol = "cube"
description = "Docker build cache, images and containers."

[[bucket]]
id = "system"
name = "Apps & system caches"
order = 80
color = "#8E8E93"
symbol = "internaldrive"
description = "App caches, browser caches and other things macOS and apps regenerate."

[[bucket]]
id = "junk"
name = "Logs, temp & trash"
order = 90
color = "#EAB308"
symbol = "trash"
description = "Logs, crash reports, temp files, old installers and the Trash."

[[bucket]]
id = "other"
name = "Unclassified"
order = 100
color = "#A1A1AA"
symbol = "questionmark.folder"
description = "Large git-ignored folders no rule explains yet. Teach poo about them with a mod."

# ---------------------------------------------------------------------------
# Recommended plans.
# ---------------------------------------------------------------------------

[[plan]]
id = "quick"
name = "Quick sweep"
order = 10
description = "Logs, temp files, crash reports and broken simulators. Nothing to rebuild."
tiers = ["junk"]
max_cost = "none"

[[plan]]
id = "stale"
name = "Not in use"
order = 20
description = "Everything nothing is using right now: old or orphaned builds, landed worktrees, and builds of checkouts you moved on from. No data is touched; you rebuild only if you go back."
tiers = ["junk", "cold", "idle"]
max_cost = "redownload"

[[plan]]
id = "deep"
name = "Deep clean"
order = 30
description = "Also builds and caches you used recently. Expect rebuilds and redownloads on your active projects."
tiers = ["junk", "cold", "idle", "warm"]
max_cost = "redownload"

[[plan]]
id = "emergency"
name = "Emergency"
order = 40
description = "Out of space: frees the least regrettable items first until the target is met."
tiers = ["junk", "cold", "idle", "warm"]
max_cost = "redownload"
greedy = true
target_free_percent = 15

# ---------------------------------------------------------------------------
# Where agents and tools put worktrees. Each one is walked like a dev root.
# ---------------------------------------------------------------------------

[[worktree_home]]
path = "~/.codex/worktrees"
agent = "codex"

[[worktree_home]]
path = "~/.claude/worktrees"
agent = "claude"

[[worktree_home]]
path = "~/conductor/workspaces"
agent = "conductor"

[[worktree_home]]
path = "~/.cursor/worktrees"
agent = "cursor"

[[worktree_home]]
path = "~/.t3/worktrees"
agent = "t3code"

[[worktree_home]]
path = "~/.superset/worktrees"
agent = "superset"

[[worktree_home]]
path = "~/.crystal/worktrees"
agent = "crystal"

[[worktree_home]]
path = "~/.vibe-kanban/worktrees"
agent = "vibe-kanban"

[[worktree_home]]
path = "~/.opencode/worktrees"
agent = "opencode"

[[worktree_home]]
path = "~/.sculptor/worktrees"
agent = "sculptor"

[[worktree_home]]
path = "~/.claude-squad/worktrees"
agent = "claude-squad"

[[worktree_home]]
path = "~/.config/container-use/worktrees"
agent = "container-use"

# ---------------------------------------------------------------------------
# Guards veto cleaning right before anything is deleted.
# ---------------------------------------------------------------------------

[[guard]]
id = "core.build-processes"
kind = "process"
description = "Skip items whose project has a running build tool or coding agent (xcodebuild, cargo, node, claude, codex...)."
names = []

# ---------------------------------------------------------------------------
# Stacks: marker files that tell poo what a project is built with.
# `tools` are the build tools that write a stack's build output. While one runs, poo can
# tell which outputs it is not using: another copy it did not name (`-derivedDataPath`,
# `--target-dir`), or with `isolated = true` (SwiftPM) the output of a sibling package. Other
# toolchains' output, dependencies and caches stay in use for every build in the checkout.
# Tools that run anything (make, ninja, bazel, turbo, nx) always keep the whole checkout.
# ---------------------------------------------------------------------------

[[stack]]
id = "rust"
name = "Rust"
markers = ["Cargo.toml"]
tools = ["cargo", "rustc", "clippy-driver", "cargo-nextest"]

[[stack]]
id = "swift"
name = "Swift package"
markers = ["Package.swift"]
tools = ["swift-build", "swift-test", "swift-run", "swift-package", "swift-frontend", "swift-driver", "swiftc", "clang", "clang++", "ld", "ld64"]
isolated = true

[[stack]]
id = "xcode"
name = "Xcode"
markers = ["*.xcodeproj", "*.xcworkspace", "project.yml", "Project.swift"]
tools = ["xcodebuild", "swift-frontend", "swift-driver", "swiftc", "clang", "clang++", "ld", "ld64", "ibtool", "actool", "codesign", "lipo", "dsymutil", "libtool", "xcrun", "pod", "carthage"]

[[stack]]
id = "node"
name = "Node.js"
markers = ["package.json"]
tools = ["npm", "pnpm", "yarn", "tsc", "esbuild", "webpack", "rollup", "vite", "next-server", "next", "parcel", "tsup", "rspack", "rsbuild", "astro", "nuxi", "nuxt", "svelte-kit", "ng", "gatsby", "vitepress", "remix"]

[[stack]]
id = "bun"
name = "Bun"
markers = ["bun.lockb", "bun.lock", "bunfig.toml"]
tools = ["bun-install", "bun-build"]

[[stack]]
id = "deno"
name = "Deno"
markers = ["deno.json", "deno.jsonc"]

[[stack]]
id = "python"
name = "Python"
markers = ["pyproject.toml", "requirements.txt", "setup.py", "Pipfile", "uv.lock", "poetry.lock"]
tools = ["pip", "uv", "poetry", "pdm", "hatch"]

[[stack]]
id = "go"
