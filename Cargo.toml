[package]
name = "poo"
version = "0.1.0"
edition = "2021"
description = "Find and safely free disk space eaten by dev builds, worktrees, caches and simulators."
license = "MIT"
repository = "https://github.com/morajabi/poo"
readme = "README.md"
default-run = "poo"

[[bin]]
name = "poo"
path = "src/main.rs"

[lib]
name = "poo"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
globset = "0.4"
include_dir = "0.7"
libc = "0.2"
plist = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
