name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - name: core mods load without errors
        run: cargo run --quiet -- mods validate --text

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path app
