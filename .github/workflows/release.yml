name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --release --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir -p out/poo
          cp target/${{ matrix.target }}/release/poo out/poo/
          cp README.md LICENSE out/poo/
          tar -C out -czf poo-${{ matrix.target }}.tar.gz poo
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: poo-${{ matrix.target }}.tar.gz

  app:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: build universal app
        env:
          ARCHS: "arm64 x86_64"
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: ./scripts/build-app.sh
      - name: notarize
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool submit dist/Poo.app.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Poo.app
          rm dist/Poo.app.zip && (cd dist && ditto -c -k --keepParent Poo.app Poo.app.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/Poo.app.zip

  publish:
    needs: [cli, app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          python3 scripts/release-manifest.py "$version" "$base" artifacts > artifacts/latest.json
          cat artifacts/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/Poo.app.zip
            artifacts/latest.json
          generate_release_notes: true
