name: release

# Every push to main whose `ci` run passed becomes a release: v<major>.<minor>.<n>,
# with major.minor from Cargo.toml and n counted up from the last tag. Put
# `[skip release]` in the head commit message to skip one. Manual runs release main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in order; a newer push waits instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: v
        run: |
          set -eu
          sha="$(git rev-parse HEAD)"
          version="$(scripts/release-version.sh "$sha")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $sha as v$version" >> "$GITHUB_STEP_SUMMARY"

  cli:
    needs: version
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: scripts/stamp-version.sh "${{ needs.version.outputs.version }}"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/poo"
          if [ "${{ matrix.target }}" != x86_64-apple-darwin ]; then
            "$bin" --version | grep -qx "poo ${{ needs.version.outputs.version }}"
          fi
          mkdir -p out/poo
          cp "$bin" out/poo/
          cp README.md LICENSE out/poo/
          tar -C out -czf poo-${{ matrix.target }}.tar.gz poo
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: poo-${{ matrix.target }}.tar.gz

  app:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/stamp-version.sh "$VERSION"
      - name: sparkle public key
        run: |
          set -eu
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not set: this release has no appcast and its app will not update itself."
            exit 0
          fi
          echo "SPARKLE_PUBLIC_KEY=$(scripts/sparkle.sh pubkey)" >> "$GITHUB_ENV"
      - name: import signing certificate
        if: env.MACOS_CERT_P12 != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          set -eu
          kc="$RUNNER_TEMP/build.keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p ci "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: build universal app
        env:
          ARCHS: "arm64 x86_64"
        run: ./scripts/build-app.sh
      - name: notarize
        if: env.SIGN_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          set -eu
          xcrun notarytool submit dist/Poo.app.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Poo.app
          rm dist/Poo.app.zip && (cd dist && ditto -c -k --keepParent Poo.app Poo.app.zip)
      - name: appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          set -eu
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Poo.app.zip"
          scripts/sparkle.sh appcast "$VERSION" "$url" dist/Poo.app.zip > dist/appcast.xml
          cat dist/appcast.xml
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            dist/Poo.app.zip
            dist/appcast.xml
          if-no-files-found: error

  publish:
    needs: [version, cli, app]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: manifest and checksums
        run: |
          set -eu
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          python3 scripts/release-manifest.py "$VERSION" "$base" artifacts > artifacts/latest.json
          (cd artifacts && sha256sum *.tar.gz Poo.app.zip latest.json $(ls appcast.xml 2>/dev/null) > SHA256SUMS)
          cat artifacts/latest.json artifacts/SHA256SUMS
          [ -f artifacts/appcast.xml ] || echo "::warning::no appcast.xml in this release (SPARKLE_PRIVATE_KEY missing)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: poo ${{ needs.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/*.tar.gz
            artifacts/Poo.app.zip
            artifacts/latest.json
            artifacts/appcast.xml
            artifacts/SHA256SUMS
