name: release

# Releases ship when a version tag is pushed (`scripts/release.sh` picks the next one
# and tags main once CI is green there). Manual runs release main's head with the next
# patch version. Every release waits for that commit's `ci` run to pass.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# One release at a time, in order; a newer tag waits instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          set -eu
          sha="$(git rev-parse HEAD)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(scripts/release-version.sh "$sha")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $sha as v$version" >> "$GITHUB_STEP_SUMMARY"
      - name: wait for ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -eu
          for i in $(seq 1 80); do
            state="$(gh run list -R "$GITHUB_REPOSITORY" -w ci -c "$SHA" -L 1 --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"' || true)"
            case "$state" in
              "completed success") echo "ci passed for $SHA"; exit 0 ;;
              completed*) echo "::error::ci did not pass for $SHA ($state)"; exit 1 ;;
              "") echo "no ci run for $SHA yet" ;;
              *) echo "ci: $state" ;;
            esac
            sleep 30
          done
          echo "::error::timed out waiting for ci on $SHA"; exit 1

  # Linux CLI builds. The macOS ones come from the app job, which signs and notarizes them.
  cli:
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: scripts/stamp-version.sh "${{ needs.version.outputs.version }}"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/poo"
          "$bin" --version | grep -qx "poo ${{ needs.version.outputs.version }}"
          mkdir -p out/poo
          cp "$bin" README.md LICENSE out/poo/
          tar -C out -czf poo-${{ matrix.target }}.tar.gz poo
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: poo-${{ matrix.target }}.tar.gz

  # Poo.app (universal) and the macOS CLI tarballs: Developer ID signed, notarized and
  # stapled when the secrets exist, ad-hoc signed otherwise.
  app:
    needs: version
    runs-on: macos-26  # Xcode 26+: build-app.sh refuses an older SDK; actool needs it for the .icon
    timeout-minutes: 60  # notarization can queue at Apple
    outputs:
      signing: ${{ steps.verify.outputs.signing }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: newest Xcode (actool compiles the Icon Composer icon)
        run: |
          x="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n1)"
          sudo xcode-select -s "$x"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/stamp-version.sh "$VERSION"
      - name: sparkle public key
        run: |
          set -eu
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            # A release without it ships an app that can never update itself: refuse.
            echo "::error::SPARKLE_PRIVATE_KEY is not set: the app would not update itself."
            exit 1
          fi
          echo "SPARKLE_PUBLIC_KEY=$(scripts/sparkle.sh pubkey)" >> "$GITHUB_ENV"
      - name: import signing certificate
        run: |
          set -eu
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "::warning::MACOS_CERT_P12 / MACOS_SIGN_IDENTITY not set: ad-hoc signed, not notarized."
            exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p ci "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: build universal app
        env:
          ARCHS: "arm64 x86_64"
        run: ./scripts/build-app.sh
      - name: sign the macOS CLI binaries
        run: |
          set -eu
          mkdir -p dist/cli
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cp "target/$t/release/poo" "dist/cli/poo-$t"
            if [ -n "${SIGN_IDENTITY:-}" ]; then
              codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "dist/cli/poo-$t"
            else
              codesign --force --sign - "dist/cli/poo-$t"
            fi
            codesign --verify --strict "dist/cli/poo-$t"
          done
          dist/cli/poo-aarch64-apple-darwin --version | grep -qx "poo $VERSION"
      - name: notarize and staple
        if: env.SIGN_IDENTITY != ''
        run: |
          set -eu
          rc=0; scripts/notarize.sh dist/Poo.app.zip || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::warning::no notarization credentials: signed with Developer ID but not notarized."
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          xcrun stapler staple dist/Poo.app
          rm dist/Poo.app.zip && (cd dist && ditto -c -k --keepParent Poo.app Poo.app.zip)
          # Bare binaries cannot be stapled; Gatekeeper finds their ticket online.
          (cd dist/cli && ditto -c -k . ../cli.zip)
          scripts/notarize.sh dist/cli.zip
          spctl -a -vv dist/Poo.app
          echo "NOTARIZED=1" >> "$GITHUB_ENV"
      - name: verify
        id: verify
        run: |
          set -eu
          codesign --verify --deep --strict --verbose=2 dist/Poo.app
          codesign -dv dist/Poo.app 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          signed="ad-hoc"; [ -n "${SIGN_IDENTITY:-}" ] && signed="Developer ID"
          note="ad-hoc signed, not notarized (first launch: right-click > Open)"
          [ -n "${SIGN_IDENTITY:-}" ] && note="Developer ID signed, not notarized"
          [ -n "${NOTARIZED:-}" ] && note="Developer ID signed and notarized by Apple"
          echo "### Poo.app and macOS CLI: $note" >> "$GITHUB_STEP_SUMMARY"
          echo "signing=$note" >> "$GITHUB_OUTPUT"
      - name: package macOS CLI
        run: |
          set -eu
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            rm -rf out && mkdir -p out/poo
            cp "dist/cli/poo-$t" out/poo/poo
            cp README.md LICENSE out/poo/
            tar -C out -czf "dist/poo-$t.tar.gz" poo
          done
      - name: appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          set -eu
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Poo.app.zip"
          scripts/sparkle.sh appcast "$VERSION" "$url" dist/Poo.app.zip > dist/appcast.xml
          cat dist/appcast.xml
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            dist/Poo.app.zip
            dist/appcast.xml
            dist/poo-*-apple-darwin.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, cli, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGNING: ${{ needs.app.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0  # tags and history for the changes list
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: manifest and checksums
        run: |
          set -eu
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          prev="$(git tag --sort=-v:refname | grep -v "^v${VERSION}$" | head -n1 || true)"
          changes="$(git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | grep -v -e '\[skip release\]' -e '^- docs:' -e '^- chore:' | head -n 30 || true)"
          cat > notes.md <<NOTES
          Poo finds and safely frees the disk space your dev work eats: build output, caches, simulators and agent worktrees. Menu bar app, CLI and MCP server. [What it does](https://github.com/${GITHUB_REPOSITORY}#readme).

          **Poo.app** (macOS 15+, universal): [Poo.app.zip](${base}/Poo.app.zip). ${SIGNING}. Updates itself. To use the CLI from Terminal too: Poo menu › Install Command-Line Tool.

          **CLI only**: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh\`, or a tarball below. Checksums in \`SHA256SUMS\`.

          ### Changes
          ${changes:-- Maintenance}
          NOTES
          python3 scripts/release-manifest.py "$VERSION" "$base" artifacts > artifacts/latest.json
          (cd artifacts && sha256sum *.tar.gz Poo.app.zip latest.json $(ls appcast.xml 2>/dev/null) > SHA256SUMS)
          cat artifacts/latest.json artifacts/SHA256SUMS
          [ -f artifacts/appcast.xml ] || echo "::warning::no appcast.xml in this release (SPARKLE_PRIVATE_KEY missing)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: poo ${{ needs.version.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            artifacts/*.tar.gz
            artifacts/Poo.app.zip
            artifacts/latest.json
            artifacts/appcast.xml
            artifacts/SHA256SUMS
