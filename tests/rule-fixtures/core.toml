# Matcher fixtures: folders a rule must match (matches = true) and must leave alone
# (matches = false). `parent` lists entries next to the folder, `children` entries inside.
# `cargo test` and `poo mods lint --core` check every one. A new rule with a generic folder
# name (build, dist, out, deps...) needs at least one of each; see CONTRIBUTING.md.

[[fixture]]
rule = "docs.mdbook"
name = "book"
parent = ["book.toml", "src"]
children = ["index.html", "searchindex.js"]
matches = true

[[fixture]]
rule = "docs.mdbook"
name = "book"
parent = ["README.md", "chapters"]
children = ["chapter1.md"]
matches = false
note = "a folder of book sources, no book.toml"

